     <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:10px\"><span class=\"tag\">Rights</span><span class=\"num\">May 2026</span></div>\n          <h3 style=\"margin:0 0 8px\">What \"biometric likeness\" really means for your AI product.</h3>\n          <p class=\"small\" style=\"margin:0\">The legal exposure most teams don't see coming — and how to source around it.</p>\n        </div>\n      </a>\n      <a class=\"card\" style=\"padding:0;overflow:hidden;display:block\">\n        <div class=\"ph wide\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>article image</span></div>\n        <div style=\"padding:22px\">\n          <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:10px\"><span class=\"tag\">Studio</span><span class=\"num\">May 2026</span></div>\n          <h3 style=\"margin:0 0 8px\">A day in the booth: inside a Moody Pines session.</h3>\n          <p class=\"small\" style=\"margin:0\">How a recording becomes a licensed, rights-cleared dataset.</p>\n        </div>\n      </a>\n      <a class=\"card\" style=\"padding:0;overflow:hidden;display:block\">\n        <div class=\"ph wide\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>article image</span></div>\n        <div style=\"padding:22px\">\n          <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:10px\"><span class=\"tag\">Craft</span><span class=\"num\">Apr 2026</span></div>\n          <h3 style=\"margin:0 0 8px\">Why the uncanny valley is a data problem, not a model problem.</h3>\n          <p class=\"small\" style=\"margin:0\">Andrew on the breadth and nuance a convincing voice actually needs.</p>\n        </div>\n      </a>\n      <a class=\"card\" style=\"padding:0;overflow:hidden;display:block\">\n        <div class=\"ph wide\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>article image</span></div>\n        <div style=\"padding:22px\">\n          <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:10px\"><span class=\"tag\">Talent</span><span class=\"num\">Apr 2026</span></div>\n          <h3 style=\"margin:0 0 8px\">Meet the voices: the people behind the roster.</h3>\n          <p class=\"small\" style=\"margin:0\">Profiles of the professionals licensing their voices on their own terms.</p>\n        </div>\n      </a>\n      <a class=\"card\" style=\"padding:0;overflow:hidden;display:block\">\n        <div class=\"ph wide\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>article image</span></div>\n        <div style=\"padding:22px\">\n          <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:10px\"><span class=\"tag\">Licensing</span><span class=\"num\">Mar 2026</span></div>\n          <h3 style=\"margin:0 0 8px\">Timed licenses, declared usage: a fairer deal for everyone.</h3>\n          <p class=\"small\" style=\"margin:0\">Why scoped rights protect talent and buyers at the same time.</p>\n        </div>\n      </a>\n    </div>\n\n    <div class=\"note\" style=\"margin-top:24px\"><b>Section note:</b> 3×2 grid of the 6 latest posts — CMS-driven later. Cards + the \"See all articles\" CTA both route to the Articles index page (to be built), with individual article layouts to follow. Headlines here are provisional, drawn from the content pillars in your strategy call.</div>\n  </div>\n</section>\n\n<!-- Section-by-section build continues below as we go -->\n<section class=\"page\" style=\"padding-top:8px\">\n  <div class=\"note\"><b>Next:</b> hero + how it works + roster + trust are in. Still to place: the problem framing (if we want it), and the final CTA. Tell me which direction's version to pull for each.</div>\n</section>\n\n<!-- FOOTER -->\n<footer class=\"footer\">\n  <div class=\"page\">\n    <div>\n      <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n      <p class=\"small\" style=\"color:#7c7975;margin-top:14px;max-width:34ch\">The rights, licensing, and data infrastructure for voice in the AI era.</p>\n    </div>\n    <div><h4>For Talent</h4><a>Join the roster</a><a>How licensing works</a><a>Your rights</a></div>\n    <div><h4>For Companies</h4><a>Request access</a><a>Voice data</a><a>Provenance</a></div>\n    <div><h4>Company</h4><a>About</a><a>Founders</a><a>Contact</a></div>\n    <div class=\"fine\"><span>© 2026 Moody Pines</span><span>Privacy · Terms</span></div>\n  </div>\n</footer>\n\n\n</body>\n</html>\n","for-talent.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Moody Pines — For Talent</title>\n<style>/* ============================================================\n   Moody Pines — Wireframe design language\n   Medium-fidelity, grayscale, real copy, placeholder imagery.\n   Annotations (designer notes) render in a single clay accent.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');\n\n:root{\n  --paper:#f4f3f1;\n  --paper-2:#ecebe8;\n  --card:#ffffff;\n  --ink:#1c1b1a;\n  --ink-2:#444240;\n  --ink-3:#74716d;\n  --line:#cfccc7;\n  --line-2:#dad7d2;\n  --fill:#dedbd6;       /* generic gray block */\n  --fill-2:#e7e4df;\n  --accent:oklch(0.62 0.11 48);     /* clay — used ONLY for designer annotations */\n  --accent-soft:oklch(0.62 0.11 48 / 0.12);\n  --radius:10px;\n  --maxw:1100px;\n  --font:'Archivo',system-ui,sans-serif;\n  --mono:'JetBrains Mono',ui-monospace,monospace;\n}\n\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:var(--font);\n  background:var(--paper);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  line-height:1.5;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\n\n/* ---------- faux browser chrome ---------- */\n.chrome{\n  display:flex;align-items:center;gap:14px;\n  padding:10px 16px;background:var(--paper-2);\n  border-bottom:1px solid var(--line);\n  position:sticky;top:0;z-index:50;\n}\n.chrome .dots{display:flex;gap:7px}\n.chrome .dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}\n.chrome .url{\n  font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  background:var(--card);border:1px solid var(--line);\n  padding:5px 12px;border-radius:20px;flex:1;max-width:360px;\n}\n\n/* ---------- site nav ---------- */\n.nav{\n  display:flex;align-items:center;justify-content:space-between;\n  gap:24px;padding:20px 40px;border-bottom:1px solid var(--line);\n  background:var(--paper);\n}\n.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}\n.brand .mark{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:18px solid var(--ink)}\n.nav .links{display:flex;gap:28px;font-size:15px;color:var(--ink-2);font-weight:500}\n.nav .links a:hover{color:var(--ink)}\n.nav-cta{display:flex;align-items:center;gap:14px}\n\n/* ---------- layout ---------- */\n.page{max-width:var(--maxw);margin:0 auto;padding:0 40px}\n.full{width:100%}\nsection{padding:72px 0}\n/* sections that ALSO carry .page for width must keep vertical padding\n   (.page's horizontal padding would otherwise override the section rule) */\nsection.page{padding-top:72px;padding-bottom:72px}\n.tight{padding:48px 0}\n.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase;margin:0 0 18px}\nh1{font-size:60px;line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 22px;text-wrap:balance}\nh2{font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;margin:0 0 16px;text-wrap:balance}\nh3{font-size:21px;line-height:1.2;letter-spacing:-.01em;font-weight:700;margin:0 0 8px}\np{margin:0 0 16px;color:var(--ink-2);font-size:17px;max-width:62ch}\n.lead{font-size:20px;color:var(--ink-2)}\n.small{font-size:14px;color:var(--ink-3)}\n.center{text-align:center}\n.center p{margin-left:auto;margin-right:auto}\n\n/* ---------- buttons (wireframe style) ---------- */\n.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:600;font-size:15px;\n  padding:13px 22px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}\n.btn-ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:9px 16px;font-size:14px}\n\n/* ---------- placeholder imagery ---------- */\n.ph{\n  position:relative;border-radius:var(--radius);overflow:hidden;\n  background:\n    repeating-linear-gradient(135deg,var(--fill) 0 11px,var(--fill-2) 11px 22px);\n  border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;text-align:center;\n}\n.ph span{\n  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);\n  background:var(--paper);padding:6px 12px;border-radius:6px;border:1px solid var(--line);\n  max-width:80%;line-height:1.4;\n}\n.ph.portrait{aspect-ratio:3/4}\n.ph.square{aspect-ratio:1/1}\n.ph.wide{aspect-ratio:16/9}\n.ph.tall{aspect-ratio:4/5}\n\n/* ---------- generic blocks ---------- */\n.grid{display:grid;gap:24px}\n.g2{grid-template-columns:repeat(2,1fr)}\n.g3{grid-template-columns:repeat(3,1fr)}\n.g4{grid-template-columns:repeat(4,1fr)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}\n.bar{height:10px;border-radius:6px;background:var(--fill);margin:7px 0}\n.bar.w80{width:80%}.bar.w60{width:60%}.bar.w40{width:40%}.bar.w90{width:90%}\n.divider{height:1px;background:var(--line);border:0;margin:0}\n.tag{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  border:1px solid var(--line);border-radius:20px;padding:4px 12px}\n.num{font-family:var(--mono);font-size:13px;color:var(--ink-3)}\n.bg-2{background:var(--paper-2)}\n.bg-ink{background:var(--ink);color:var(--paper)}\n.bg-ink p{color:#b9b6b2}.bg-ink .eyebrow{color:#8d8a86}\n\n/* ---------- comparison table (AI-company value props) ---------- */\n.cmp{display:grid;grid-template-columns:0.85fr 1.15fr 1.15fr;margin-top:30px;\n  border-top:1px solid var(--line);border-left:1px solid var(--line)}\n.cmp>div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}\n.cmp .corner{background:var(--paper-2)}\n.cmp .span{grid-column:2 / span 2;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;\n  text-transform:uppercase;color:var(--ink-3);background:var(--paper-2);text-align:center}\n.cmp .rowlabel{font-weight:700;color:var(--ink);background:var(--paper-2);display:flex;align-items:center;font-size:15px}\n.cmp .h{font-weight:700;font-size:15px;letter-spacing:-.01em}\n/* the highlighted Moody Pines column */\n.cmp .mp{background:var(--card);color:var(--ink);font-weight:500;\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink)}\n.cmp .mp.h{background:var(--ink);color:var(--paper);\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 2px 0 var(--ink)}\n.cmp .mp.last{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 -2px 0 var(--ink)}\n/* the muted traditional column */\n.cmp .trad{color:var(--ink-3)}\n.cmp .trad.h{color:var(--ink-2);background:var(--paper-2)}\n\n/* ---------- designer annotations (the only color) ---------- */\n.note{\n  position:relative;font-family:var(--mono);font-size:12.5px;line-height:1.45;\n  color:var(--accent);border:1px dashed var(--accent);background:var(--accent-soft);\n  border-radius:8px;padding:10px 14px 10px 30px;margin:0 0 22px;max-width:70ch;\n}\n.note::before{content:\"✱\";position:absolute;left:12px;top:9px;font-size:13px}\n.note b{font-weight:600}\n.no-notes .note{display:none}\n\n/* direction banner (top of each homepage variant) */\n.concept{\n  font-family:var(--mono);background:var(--accent);color:#fff;\n  padding:8px 40px;font-size:12.5px;letter-spacing:.03em;display:flex;gap:10px;align-items:center;\n}\n.concept b{font-weight:600}\n.no-notes .concept{display:none}\n\n/* ---------- footer ---------- */\n.footer{background:var(--ink);color:#b9b6b2;padding:56px 0 36px;margin-top:40px}\n.footer .page{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}\n.footer h4{color:var(--paper);font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;font-weight:500}\n.footer a{display:block;color:#b9b6b2;font-size:14px;margin-bottom:9px}\n.footer a:hover{color:var(--paper)}\n.footer .brand{color:var(--paper)}\n.footer .brand .mark{border-bottom-color:var(--paper)}\n.footer .fine{grid-column:1/-1;border-top:1px solid #3a3836;margin-top:28px;padding-top:20px;font-size:12.5px;color:#7c7975;display:flex;justify-content:space-between}\n\n/* ---------- responsive-ish ---------- */\n@media(max-width:880px){\n  h1{font-size:42px}h2{font-size:30px}\n  .g2,.g3,.g4{grid-template-columns:1fr}\n  .nav .links{display:none}\n  .footer .page{grid-template-columns:1fr 1fr}\n  .cmp{grid-template-columns:1fr 1fr;font-size:13px}\n  .cmp>div{padding:12px 12px}\n  .cmp .rowlabel{grid-column:1 / -1;background:var(--paper-2)}\n  .cmp .corner{display:none}\n  .cmp .span{grid-column:1 / -1}\n}\n</style>\n</head>\n<body>\n\n<div class=\"chrome\">\n  <div class=\"dots\"><i></i><i></i><i></i></div>\n  <div class=\"url\">moodypines.com/for-talent</div>\n</div>\n\n<div class=\"concept\"><b>INNER PAGE · \"For Talent\"</b> — Supply-side. Answers the five fears head-on (pay, control, usage, attribution, trust). Reassurance + craft, ending in a roster application CTA. Direction-agnostic structure.</div>\n\n<!-- NAV -->\n<nav class=\"nav\">\n  <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n  <div class=\"links\"><a>For Talent</a><a>For AI Companies</a><a>How it works</a><a>About</a></div>\n  <div class=\"nav-cta\"><a class=\"btn sm\">Join early access</a></div>\n</nav>\n\n<!-- HERO -->\n<header class=\"page\" style=\"padding-top:64px;padding-bottom:24px\">\n  <div class=\"grid g2\" style=\"gap:48px;align-items:center\">\n    <div>\n      <p class=\"eyebrow\">For voice talent</p>\n      <h1 style=\"font-size:54px\">Your voice is an asset. We help you license it like one.</h1>\n      <p class=\"lead\" style=\"max-width:50ch\">Get paid fairly, stay in control, and know exactly how your voice is used — every time, by everyone.</p>\n      <div style=\"display:flex;gap:14px;margin-top:24px;flex-wrap:wrap\">\n        <a class=\"btn\">Apply to the roster</a>\n        <a class=\"btn btn-ghost\">How licensing works</a>\n      </div>\n    </div>\n    <div class=\"ph portrait\" style=\"height:500px;aspect-ratio:auto\"><span>DOCUMENTARY PORTRAIT · talent at the mic, relaxed, in their element</span></div>\n  </div>\n</header>\n\n<!-- THE FIVE QUESTIONS -->\n<section class=\"page\">\n  <p class=\"eyebrow\">Your questions, answered</p>\n  <h2>Five things every voice professional asks us.</h2>\n  <div class=\"note\"><b>Source:</b> these five map directly to the talent concerns in the brand doc — pay, amount, control, usage, trust. Each gets a plain, honest answer.</div>\n  <div class=\"grid g2\" style=\"gap:20px;margin-top:24px\">\n    <div class=\"card\"><span class=\"num\">01</span><h3 style=\"margin:8px 0\">Will I get paid?</h3><p class=\"small\" style=\"margin:0\">Yes. Every license is a paid license, with clear, fair terms agreed up front.</p></div>\n    <div class=\"card\"><span class=\"num\">02</span><h3 style=\"margin:8px 0\">How much?</h3><p class=\"small\" style=\"margin:0\">Transparent rates by usage and scope — no mystery deductions, no hidden downstream deals.</p></div>\n    <div class=\"card\"><span class=\"num\">03</span><h3 style=\"margin:8px 0\">Who controls my voice?</h3><p class=\"small\" style=\"margin:0\">You do. You set what your voice can and can't be used for — and you can revoke consent.</p></div>\n    <div class=\"card\"><span class=\"num\">04</span><h3 style=\"margin:8px 0\">What can it be used for?</h3><p class=\"small\" style=\"margin:0\">Only what you approve. Usage is scoped in the contract and tracked end to end.</p></div>\n    <div class=\"card\"><span class=\"num\">05</span><h3 style=\"margin:8px 0\">Can I trust this company?</h3><p class=\"small\" style=\"margin:0\">Provenance and attribution travel with your voice. You can see where it goes, always.</p></div>\n    <div class=\"card bg-ink\"><span class=\"num\" style=\"color:#8d8a86\">↳</span><h3 style=\"margin:8px 0;color:var(--paper)\">Still have questions?</h3><p class=\"small\" style=\"margin:0;color:#b9b6b2\">Talk to a real person on the talent team before you commit anything.</p></div>\n  </div>\n</section>\n\n<!-- HOW IT WORKS FOR TALENT -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <p class=\"eyebrow\">The process</p>\n    <h2>From application to first license.</h2>\n    <div class=\"grid g4\" style=\"margin-top:26px\">\n      <div><div class=\"num\">STEP 01</div><h3 style=\"margin-top:8px\">Apply</h3><p class=\"small\">Tell us about your voice and your work. We review every application.</p></div>\n      <div><div class=\"num\">STEP 02</div><h3 style=\"margin-top:8px\">Record</h3><p class=\"small\">Studio-grade sessions, on your schedule. Quality is the whole point.</p></div>\n      <div><div class=\"num\">STEP 03</div><h3 style=\"margin-top:8px\">Set your terms</h3><p class=\"small\">Define usage, scope, and limits. Your voice, your rules.</p></div>\n      <div><div class=\"num\">STEP 04</div><h3 style=\"margin-top:8px\">Get licensed &amp; paid</h3><p class=\"small\">AI companies license under your terms. You're paid and credited.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- A PROMISE / RIGHTS -->\n<section class=\"page\">\n  <div class=\"grid g2\" style=\"gap:48px;align-items:start\">\n    <div>\n      <p class=\"eyebrow\">Our promise</p>\n      <h2 style=\"margin:0\">The terms are written for you, not around you.</h2>\n      <div class=\"note\" style=\"margin-top:18px\"><b>Tone note:</b> this is the advocacy heart of the page. Plain language, no legalese — the contract is a feature, not fine print.</div>\n    </div>\n    <div>\n      <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✓</span><div><h3>Plain-language contracts</h3><p class=\"small\" style=\"margin:0\">If you can't understand it, it isn't fair.</p></div></div>\n      <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✓</span><div><h3>Revocable consent</h3><p class=\"small\" style=\"margin:0\">Change your mind? You can walk away.</p></div></div>\n      <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✓</span><div><h3>Usage transparency</h3><p class=\"small\" style=\"margin:0\">See who licensed your voice and for what.</p></div></div>\n      <div style=\"display:flex;gap:16px;padding:16px 0\"><span class=\"num\">✓</span><div><h3>Attribution that travels</h3><p class=\"small\" style=\"margin:0\">Credit stays attached to your voice.</p></div></div>\n    </div>\n  </div>\n</section>\n\n<!-- TALENT VOICES -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <p class=\"eyebrow\">From the roster</p>\n    <h2>People already lending their voices.</h2>\n    <div class=\"grid g3\" style=\"margin-top:26px\">\n      <div class=\"card\"><div class=\"ph square\" style=\"margin-bottom:16px\"><span>portrait</span></div><p class=\"small\" style=\"margin:0\">\"The first deal in the AI era that actually felt fair.\"</p><p class=\"num\" style=\"margin-top:12px\">Narrator · audiobooks</p></div>\n      <div class=\"card\"><div class=\"ph square\" style=\"margin-bottom:16px\"><span>portrait</span></div><p class=\"small\" style=\"margin:0\">\"I always know where my voice is — and where it isn't.\"</p><p class=\"num\" style=\"margin-top:12px\">Broadcast &amp; commercial</p></div>\n      <div class=\"card\"><div class=\"ph square\" style=\"margin-bottom:16px\"><span>portrait</span></div><p class=\"small\" style=\"margin:0\">\"They treated my voice like it mattered. Because it does.\"</p><p class=\"num\" style=\"margin-top:12px\">Character &amp; games VO</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- CTA -->\n<section class=\"page center\">\n  <h2>Ready to license your voice on your terms?</h2>\n  <p>Apply to the roster or join the early-access list — we review every application personally.</p>\n  <div style=\"display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap\">\n    <a class=\"btn\">Apply to the roster</a>\n    <a class=\"btn btn-ghost\">Join early access</a>\n  </div>\n</section>\n\n<!-- FOOTER -->\n<footer class=\"footer\">\n  <div class=\"page\">\n    <div>\n      <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n      <p class=\"small\" style=\"color:#7c7975;margin-top:14px;max-width:34ch\">The rights, licensing, and data infrastructure for voice in the AI era.</p>\n    </div>\n    <div><h4>For Talent</h4><a>Join the roster</a><a>How licensing works</a><a>Your rights</a></div>\n    <div><h4>For Companies</h4><a>Request access</a><a>Voice data</a><a>Provenance</a></div>\n    <div><h4>Company</h4><a>About</a><a>Founders</a><a>Contact</a></div>\n    <div class=\"fine\"><span>© 2026 Moody Pines</span><span>Privacy · Terms</span></div>\n  </div>\n</footer>\n\n\n</body>\n</html>\n","for-ai-companies.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Moody Pines — For AI Companies</title>\n<style>/* ============================================================\n   Moody Pines — Wireframe design language\n   Medium-fidelity, grayscale, real copy, placeholder imagery.\n   Annotations (designer notes) render in a single clay accent.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');\n\n:root{\n  --paper:#f4f3f1;\n  --paper-2:#ecebe8;\n  --card:#ffffff;\n  --ink:#1c1b1a;\n  --ink-2:#444240;\n  --ink-3:#74716d;\n  --line:#cfccc7;\n  --line-2:#dad7d2;\n  --fill:#dedbd6;       /* generic gray block */\n  --fill-2:#e7e4df;\n  --accent:oklch(0.62 0.11 48);     /* clay — used ONLY for designer annotations */\n  --accent-soft:oklch(0.62 0.11 48 / 0.12);\n  --radius:10px;\n  --maxw:1100px;\n  --font:'Archivo',system-ui,sans-serif;\n  --mono:'JetBrains Mono',ui-monospace,monospace;\n}\n\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:var(--font);\n  background:var(--paper);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  line-height:1.5;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\n\n/* ---------- faux browser chrome ---------- */\n.chrome{\n  display:flex;align-items:center;gap:14px;\n  padding:10px 16px;background:var(--paper-2);\n  border-bottom:1px solid var(--line);\n  position:sticky;top:0;z-index:50;\n}\n.chrome .dots{display:flex;gap:7px}\n.chrome .dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}\n.chrome .url{\n  font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  background:var(--card);border:1px solid var(--line);\n  padding:5px 12px;border-radius:20px;flex:1;max-width:360px;\n}\n\n/* ---------- site nav ---------- */\n.nav{\n  display:flex;align-items:center;justify-content:space-between;\n  gap:24px;padding:20px 40px;border-bottom:1px solid var(--line);\n  background:var(--paper);\n}\n.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}\n.brand .mark{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:18px solid var(--ink)}\n.nav .links{display:flex;gap:28px;font-size:15px;color:var(--ink-2);font-weight:500}\n.nav .links a:hover{color:var(--ink)}\n.nav-cta{display:flex;align-items:center;gap:14px}\n\n/* ---------- layout ---------- */\n.page{max-width:var(--maxw);margin:0 auto;padding:0 40px}\n.full{width:100%}\nsection{padding:72px 0}\n/* sections that ALSO carry .page for width must keep vertical padding\n   (.page's horizontal padding would otherwise override the section rule) */\nsection.page{padding-top:72px;padding-bottom:72px}\n.tight{padding:48px 0}\n.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase;margin:0 0 18px}\nh1{font-size:60px;line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 22px;text-wrap:balance}\nh2{font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;margin:0 0 16px;text-wrap:balance}\nh3{font-size:21px;line-height:1.2;letter-spacing:-.01em;font-weight:700;margin:0 0 8px}\np{margin:0 0 16px;color:var(--ink-2);font-size:17px;max-width:62ch}\n.lead{font-size:20px;color:var(--ink-2)}\n.small{font-size:14px;color:var(--ink-3)}\n.center{text-align:center}\n.center p{margin-left:auto;margin-right:auto}\n\n/* ---------- buttons (wireframe style) ---------- */\n.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:600;font-size:15px;\n  padding:13px 22px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}\n.btn-ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:9px 16px;font-size:14px}\n\n/* ---------- placeholder imagery ---------- */\n.ph{\n  position:relative;border-radius:var(--radius);overflow:hidden;\n  background:\n    repeating-linear-gradient(135deg,var(--fill) 0 11px,var(--fill-2) 11px 22px);\n  border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;text-align:center;\n}\n.ph span{\n  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);\n  background:var(--paper);padding:6px 12px;border-radius:6px;border:1px solid var(--line);\n  max-width:80%;line-height:1.4;\n}\n.ph.portrait{aspect-ratio:3/4}\n.ph.square{aspect-ratio:1/1}\n.ph.wide{aspect-ratio:16/9}\n.ph.tall{aspect-ratio:4/5}\n\n/* ---------- generic blocks ---------- */\n.grid{display:grid;gap:24px}\n.g2{grid-template-columns:repeat(2,1fr)}\n.g3{grid-template-columns:repeat(3,1fr)}\n.g4{grid-template-columns:repeat(4,1fr)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}\n.bar{height:10px;border-radius:6px;background:var(--fill);margin:7px 0}\n.bar.w80{width:80%}.bar.w60{width:60%}.bar.w40{width:40%}.bar.w90{width:90%}\n.divider{height:1px;background:var(--line);border:0;margin:0}\n.tag{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  border:1px solid var(--line);border-radius:20px;padding:4px 12px}\n.num{font-family:var(--mono);font-size:13px;color:var(--ink-3)}\n.bg-2{background:var(--paper-2)}\n.bg-ink{background:var(--ink);color:var(--paper)}\n.bg-ink p{color:#b9b6b2}.bg-ink .eyebrow{color:#8d8a86}\n\n/* ---------- comparison table (AI-company value props) ---------- */\n.cmp{display:grid;grid-template-columns:0.85fr 1.15fr 1.15fr;margin-top:30px;\n  border-top:1px solid var(--line);border-left:1px solid var(--line)}\n.cmp>div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}\n.cmp .corner{background:var(--paper-2)}\n.cmp .span{grid-column:2 / span 2;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;\n  text-transform:uppercase;color:var(--ink-3);background:var(--paper-2);text-align:center}\n.cmp .rowlabel{font-weight:700;color:var(--ink);background:var(--paper-2);display:flex;align-items:center;font-size:15px}\n.cmp .h{font-weight:700;font-size:15px;letter-spacing:-.01em}\n/* the highlighted Moody Pines column */\n.cmp .mp{background:var(--card);color:var(--ink);font-weight:500;\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink)}\n.cmp .mp.h{background:var(--ink);color:var(--paper);\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 2px 0 var(--ink)}\n.cmp .mp.last{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 -2px 0 var(--ink)}\n/* the muted traditional column */\n.cmp .trad{color:var(--ink-3)}\n.cmp .trad.h{color:var(--ink-2);background:var(--paper-2)}\n\n/* ---------- designer annotations (the only color) ---------- */\n.note{\n  position:relative;font-family:var(--mono);font-size:12.5px;line-height:1.45;\n  color:var(--accent);border:1px dashed var(--accent);background:var(--accent-soft);\n  border-radius:8px;padding:10px 14px 10px 30px;margin:0 0 22px;max-width:70ch;\n}\n.note::before{content:\"✱\";position:absolute;left:12px;top:9px;font-size:13px}\n.note b{font-weight:600}\n.no-notes .note{display:none}\n\n/* direction banner (top of each homepage variant) */\n.concept{\n  font-family:var(--mono);background:var(--accent);color:#fff;\n  padding:8px 40px;font-size:12.5px;letter-spacing:.03em;display:flex;gap:10px;align-items:center;\n}\n.concept b{font-weight:600}\n.no-notes .concept{display:none}\n\n/* ---------- footer ---------- */\n.footer{background:var(--ink);color:#b9b6b2;padding:56px 0 36px;margin-top:40px}\n.footer .page{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}\n.footer h4{color:var(--paper);font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;font-weight:500}\n.footer a{display:block;color:#b9b6b2;font-size:14px;margin-bottom:9px}\n.footer a:hover{color:var(--paper)}\n.footer .brand{color:var(--paper)}\n.footer .brand .mark{border-bottom-color:var(--paper)}\n.footer .fine{grid-column:1/-1;border-top:1px solid #3a3836;margin-top:28px;padding-top:20px;font-size:12.5px;color:#7c7975;display:flex;justify-content:space-between}\n\n/* ---------- responsive-ish ---------- */\n@media(max-width:880px){\n  h1{font-size:42px}h2{font-size:30px}\n  .g2,.g3,.g4{grid-template-columns:1fr}\n  .nav .links{display:none}\n  .footer .page{grid-template-columns:1fr 1fr}\n  .cmp{grid-template-columns:1fr 1fr;font-size:13px}\n  .cmp>div{padding:12px 12px}\n  .cmp .rowlabel{grid-column:1 / -1;background:var(--paper-2)}\n  .cmp .corner{display:none}\n  .cmp .span{grid-column:1 / -1}\n}\n</style>\n</head>\n<body>\n\n<div class=\"chrome\">\n  <div class=\"dots\"><i></i><i></i><i></i></div>\n  <div class=\"url\">moodypines.com/for-ai-companies</div>\n</div>\n\n<div class=\"concept\"><b>INNER PAGE · \"For AI Companies\"</b> — Demand-side. Cooler, more technical register: quality, clear rights, legal protection, speed. Still human-sourced, never \"tech bro.\" Ends in request-access CTA.</div>\n\n<!-- NAV -->\n<nav class=\"nav\">\n  <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n  <div class=\"links\"><a>For Talent</a><a>For AI Companies</a><a>How it works</a><a>About</a></div>\n  <div class=\"nav-cta\"><a class=\"btn sm\">Request access</a></div>\n</nav>\n\n<!-- HERO -->\n<header class=\"page\" style=\"padding-top:64px;padding-bottom:24px\">\n  <div class=\"grid g2\" style=\"gap:48px;align-items:center\">\n    <div>\n      <p class=\"eyebrow\">For AI companies</p>\n      <h1 style=\"font-size:54px\">Premium voice data you can legally stand behind.</h1>\n      <p class=\"lead\" style=\"max-width:50ch\">Licensed from real professionals, with consent and provenance built in. Acquire the voice assets you need — without inheriting the risk.</p>\n      <div style=\"display:flex;gap:14px;margin-top:24px;flex-wrap:wrap\">\n        <a class=\"btn\">Request access</a>\n        <a class=\"btn btn-ghost\">Talk to our team</a>\n      </div>\n    </div>\n    <div class=\"ph wide\" style=\"height:420px;aspect-ratio:auto\"><span>DOCUMENTARY · engineer + talent at the console, working a session — observational, real</span></div>\n  </div>\n</header>\n\n<!-- WHAT YOU GET -->\n<section class=\"page\">\n  <p class=\"eyebrow\">What you license</p>\n  <h2>Voice data built for deployment.</h2>\n  <div class=\"grid g4\" style=\"margin-top:26px\">\n    <div class=\"card\"><h3>Premium recordings</h3><p class=\"small\" style=\"margin:0\">Studio-grade audio from vetted professional talent — not scraped, not synthetic.</p></div>\n    <div class=\"card\"><h3>Clear licensing rights</h3><p class=\"small\" style=\"margin:0\">Standardized contracts that spell out exactly what you can do, at what scale.</p></div>\n    <div class=\"card\"><h3>Legal protection</h3><p class=\"small\" style=\"margin:0\">Consent and provenance documented end to end — defensible if it's ever questioned.</p></div>\n    <div class=\"card\"><h3>Fast deployment</h3><p class=\"small\" style=\"margin:0\">Cleared, structured, and ready to use — so your team can move.</p></div>\n  </div>\n</section>\n\n<!-- THE RISK SECTION -->\n<section class=\"bg-ink\">\n  <div class=\"page\">\n    <div class=\"grid g2\" style=\"gap:48px;align-items:center\">\n      <div>\n        <p class=\"eyebrow\">Why it matters</p>\n        <h2 style=\"color:var(--paper)\">The data is only as good as its paperwork.</h2>\n        <p style=\"max-width:54ch\">Consent. Provenance. Rights management. Legal exposure. Litigation risk. As models get more powerful, these stop being edge cases and start being existential.</p>\n        <p style=\"color:var(--paper);font-weight:600;max-width:54ch\">Moody Pines gives you voice data with the rights story already solved.</p>\n      </div>\n      <div class=\"card\" style=\"padding:28px\">\n        <p class=\"num\">RISK, REMOVED</p>\n        <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✓</span><p class=\"small\" style=\"margin:0\">Explicit, recorded consent for every voice</p></div>\n        <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✓</span><p class=\"small\" style=\"margin:0\">Full provenance chain, source to license</p></div>\n        <div style=\"display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✓</span><p class=\"small\" style=\"margin:0\">Standardized, auditable contracts</p></div>\n        <div style=\"display:flex;gap:14px;padding:12px 0\"><span class=\"num\">✓</span><p class=\"small\" style=\"margin:0\">Usage scoped and tracked</p></div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- HOW IT WORKS FOR BUYERS -->\n<section class=\"page\">\n  <p class=\"eyebrow\">How it works</p>\n  <h2>From request to deployment.</h2>\n  <div class=\"grid g4\" style=\"margin-top:26px\">\n    <div><div class=\"num\">STEP 01</div><h3 style=\"margin-top:8px\">Tell us what you need</h3><p class=\"small\">Accents, languages, styles, emotional range, volume — define the spec.</p></div>\n    <div><div class=\"num\">STEP 02</div><h3 style=\"margin-top:8px\">We match &amp; record</h3><p class=\"small\">From the roster, or commissioned sessions to your requirements.</p></div>\n    <div><div class=\"num\">STEP 03</div><h3 style=\"margin-top:8px\">License with clear rights</h3><p class=\"small\">Standardized terms, scoped usage, documented consent.</p></div>\n    <div><div class=\"num\">STEP 04</div><h3 style=\"margin-top:8px\">Deploy with confidence</h3><p class=\"small\">Premium data, ready to use, with the paperwork behind it.</p></div>\n  </div>\n</section>\n\n<!-- WHO WE SERVE -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <p class=\"eyebrow\">Who we serve</p>\n    <h2>Built for teams shipping voice.</h2>\n    <div class=\"grid g3\" style=\"margin-top:24px\">\n      <div class=\"card\"><h3>Frontier &amp; voice AI labs</h3><p class=\"small\" style=\"margin:0\">High-volume, high-quality datasets with airtight rights.</p></div>\n      <div class=\"card\"><h3>Consumer AI &amp; agents</h3><p class=\"small\" style=\"margin:0\">Distinctive, licensed voices for assistants and products.</p></div>\n      <div class=\"card\"><h3>Enterprise applications</h3><p class=\"small\" style=\"margin:0\">Defensible voice data that passes legal review.</p></div>\n    </div>\n    <div class=\"note\" style=\"margin-top:20px\"><b>Note:</b> categories pulled straight from the brand doc's demand-side list. Kept to three so it reads as focus, not a laundry list.</div>\n  </div>\n</section>\n\n<!-- CTA -->\n<section class=\"page center\">\n  <h2>Let's talk about what you need.</h2>\n  <p>Request access to the platform or book a call with our team to scope your first license.</p>\n  <div style=\"display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap\">\n    <a class=\"btn\">Request access</a>\n    <a class=\"btn btn-ghost\">Book a call</a>\n  </div>\n</section>\n\n<!-- FOOTER -->\n<footer class=\"footer\">\n  <div class=\"page\">\n    <div>\n      <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n      <p class=\"small\" style=\"color:#7c7975;margin-top:14px;max-width:34ch\">The rights, licensing, and data infrastructure for voice in the AI era.</p>\n    </div>\n    <div><h4>For Talent</h4><a>Join the roster</a><a>How licensing works</a><a>Your rights</a></div>\n    <div><h4>For Companies</h4><a>Request access</a><a>Voice data</a><a>Provenance</a></div>\n    <div><h4>Company</h4><a>About</a><a>Founders</a><a>Contact</a></div>\n    <div class=\"fine\"><span>© 2026 Moody Pines</span><span>Privacy · Terms</span></div>\n  </div>\n</footer>\n\n\n</body>\n</html>\n","about.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Moody Pines — About</title>\n<style>/* ============================================================\n   Moody Pines — Wireframe design language\n   Medium-fidelity, grayscale, real copy, placeholder imagery.\n   Annotations (designer notes) render in a single clay accent.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');\n\n:root{\n  --paper:#f4f3f1;\n  --paper-2:#ecebe8;\n  --card:#ffffff;\n  --ink:#1c1b1a;\n  --ink-2:#444240;\n  --ink-3:#74716d;\n  --line:#cfccc7;\n  --line-2:#dad7d2;\n  --fill:#dedbd6;       /* generic gray block */\n  --fill-2:#e7e4df;\n  --accent:oklch(0.62 0.11 48);     /* clay — used ONLY for designer annotations */\n  --accent-soft:oklch(0.62 0.11 48 / 0.12);\n  --radius:10px;\n  --maxw:1100px;\n  --font:'Archivo',system-ui,sans-serif;\n  --mono:'JetBrains Mono',ui-monospace,monospace;\n}\n\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:var(--font);\n  background:var(--paper);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  line-height:1.5;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\n\n/* ---------- faux browser chrome ---------- */\n.chrome{\n  display:flex;align-items:center;gap:14px;\n  padding:10px 16px;background:var(--paper-2);\n  border-bottom:1px solid var(--line);\n  position:sticky;top:0;z-index:50;\n}\n.chrome .dots{display:flex;gap:7px}\n.chrome .dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}\n.chrome .url{\n  font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  background:var(--card);border:1px solid var(--line);\n  padding:5px 12px;border-radius:20px;flex:1;max-width:360px;\n}\n\n/* ---------- site nav ---------- */\n.nav{\n  display:flex;align-items:center;justify-content:space-between;\n  gap:24px;padding:20px 40px;border-bottom:1px solid var(--line);\n  background:var(--paper);\n}\n.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}\n.brand .mark{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:18px solid var(--ink)}\n.nav .links{display:flex;gap:28px;font-size:15px;color:var(--ink-2);font-weight:500}\n.nav .links a:hover{color:var(--ink)}\n.nav-cta{display:flex;align-items:center;gap:14px}\n\n/* ---------- layout ---------- */\n.page{max-width:var(--maxw);margin:0 auto;padding:0 40px}\n.full{width:100%}\nsection{padding:72px 0}\n/* sections that ALSO carry .page for width must keep vertical padding\n   (.page's horizontal padding would otherwise override the section rule) */\nsection.page{padding-top:72px;padding-bottom:72px}\n.tight{padding:48px 0}\n.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase;margin:0 0 18px}\nh1{font-size:60px;line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 22px;text-wrap:balance}\nh2{font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;margin:0 0 16px;text-wrap:balance}\nh3{font-size:21px;line-height:1.2;letter-spacing:-.01em;font-weight:700;margin:0 0 8px}\np{margin:0 0 16px;color:var(--ink-2);font-size:17px;max-width:62ch}\n.lead{font-size:20px;color:var(--ink-2)}\n.small{font-size:14px;color:var(--ink-3)}\n.center{text-align:center}\n.center p{margin-left:auto;margin-right:auto}\n\n/* ---------- buttons (wireframe style) ---------- */\n.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:600;font-size:15px;\n  padding:13px 22px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}\n.btn-ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:9px 16px;font-size:14px}\n\n/* ---------- placeholder imagery ---------- */\n.ph{\n  position:relative;border-radius:var(--radius);overflow:hidden;\n  background:\n    repeating-linear-gradient(135deg,var(--fill) 0 11px,var(--fill-2) 11px 22px);\n  border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;text-align:center;\n}\n.ph span{\n  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);\n  background:var(--paper);padding:6px 12px;border-radius:6px;border:1px solid var(--line);\n  max-width:80%;line-height:1.4;\n}\n.ph.portrait{aspect-ratio:3/4}\n.ph.square{aspect-ratio:1/1}\n.ph.wide{aspect-ratio:16/9}\n.ph.tall{aspect-ratio:4/5}\n\n/* ---------- generic blocks ---------- */\n.grid{display:grid;gap:24px}\n.g2{grid-template-columns:repeat(2,1fr)}\n.g3{grid-template-columns:repeat(3,1fr)}\n.g4{grid-template-columns:repeat(4,1fr)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}\n.bar{height:10px;border-radius:6px;background:var(--fill);margin:7px 0}\n.bar.w80{width:80%}.bar.w60{width:60%}.bar.w40{width:40%}.bar.w90{width:90%}\n.divider{height:1px;background:var(--line);border:0;margin:0}\n.tag{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  border:1px solid var(--line);border-radius:20px;padding:4px 12px}\n.num{font-family:var(--mono);font-size:13px;color:var(--ink-3)}\n.bg-2{background:var(--paper-2)}\n.bg-ink{background:var(--ink);color:var(--paper)}\n.bg-ink p{color:#b9b6b2}.bg-ink .eyebrow{color:#8d8a86}\n\n/* ---------- comparison table (AI-company value props) ---------- */\n.cmp{display:grid;grid-template-columns:0.85fr 1.15fr 1.15fr;margin-top:30px;\n  border-top:1px solid var(--line);border-left:1px solid var(--line)}\n.cmp>div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}\n.cmp .corner{background:var(--paper-2)}\n.cmp .span{grid-column:2 / span 2;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;\n  text-transform:uppercase;color:var(--ink-3);background:var(--paper-2);text-align:center}\n.cmp .rowlabel{font-weight:700;color:var(--ink);background:var(--paper-2);display:flex;align-items:center;font-size:15px}\n.cmp .h{font-weight:700;font-size:15px;letter-spacing:-.01em}\n/* the highlighted Moody Pines column */\n.cmp .mp{background:var(--card);color:var(--ink);font-weight:500;\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink)}\n.cmp .mp.h{background:var(--ink);color:var(--paper);\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 2px 0 var(--ink)}\n.cmp .mp.last{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 -2px 0 var(--ink)}\n/* the muted traditional column */\n.cmp .trad{color:var(--ink-3)}\n.cmp .trad.h{color:var(--ink-2);background:var(--paper-2)}\n\n/* ---------- designer annotations (the only color) ---------- */\n.note{\n  position:relative;font-family:var(--mono);font-size:12.5px;line-height:1.45;\n  color:var(--accent);border:1px dashed var(--accent);background:var(--accent-soft);\n  border-radius:8px;padding:10px 14px 10px 30px;margin:0 0 22px;max-width:70ch;\n}\n.note::before{content:\"✱\";position:absolute;left:12px;top:9px;font-size:13px}\n.note b{font-weight:600}\n.no-notes .note{display:none}\n\n/* direction banner (top of each homepage variant) */\n.concept{\n  font-family:var(--mono);background:var(--accent);color:#fff;\n  padding:8px 40px;font-size:12.5px;letter-spacing:.03em;display:flex;gap:10px;align-items:center;\n}\n.concept b{font-weight:600}\n.no-notes .concept{display:none}\n\n/* ---------- footer ---------- */\n.footer{background:var(--ink);color:#b9b6b2;padding:56px 0 36px;margin-top:40px}\n.footer .page{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}\n.footer h4{color:var(--paper);font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;font-weight:500}\n.footer a{display:block;color:#b9b6b2;font-size:14px;margin-bottom:9px}\n.footer a:hover{color:var(--paper)}\n.footer .brand{color:var(--paper)}\n.footer .brand .mark{border-bottom-color:var(--paper)}\n.footer .fine{grid-column:1/-1;border-top:1px solid #3a3836;margin-top:28px;padding-top:20px;font-size:12.5px;color:#7c7975;display:flex;justify-content:space-between}\n\n/* ---------- responsive-ish ---------- */\n@media(max-width:880px){\n  h1{font-size:42px}h2{font-size:30px}\n  .g2,.g3,.g4{grid-template-columns:1fr}\n  .nav .links{display:none}\n  .footer .page{grid-template-columns:1fr 1fr}\n  .cmp{grid-template-columns:1fr 1fr;font-size:13px}\n  .cmp>div{padding:12px 12px}\n  .cmp .rowlabel{grid-column:1 / -1;background:var(--paper-2)}\n  .cmp .corner{display:none}\n  .cmp .span{grid-column:1 / -1}\n}\n</style>\n</head>\n<body>\n\n<div class=\"chrome\">\n  <div class=\"dots\"><i></i><i></i><i></i></div>\n  <div class=\"url\">moodypines.com/about</div>\n</div>\n\n<div class=\"concept\"><b>INNER PAGE · \"About\"</b> — Mission + founders. Holds the brand tension explicitly: advocate for talent AND credible infrastructure. Founders humanize it; the \"what we're not\" section keeps positioning sharp.</div>\n\n<!-- NAV -->\n<nav class=\"nav\">\n  <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n  <div class=\"links\"><a>For Talent</a><a>For AI Companies</a><a>How it works</a><a>About</a></div>\n  <div class=\"nav-cta\"><a class=\"btn sm\">Join early access</a></div>\n</nav>\n\n<!-- MISSION HERO -->\n<header class=\"page\" style=\"padding-top:80px;padding-bottom:40px\">\n  <p class=\"eyebrow\">Our mission</p>\n  <h1 style=\"font-size:64px;max-width:20ch\">Helping human voices thrive in the age of AI.</h1>\n  <p class=\"lead\" style=\"max-width:60ch\">AI learned to speak from people. We're building the rights, licensing, and data infrastructure that makes sure those people are paid, credited, and in control — and that the companies building with voice can do it responsibly.</p>\n  <div class=\"note\" style=\"margin-top:26px\"><b>Positioning anchor:</b> this is the emotional positioning line verbatim from the brand doc. The whole page resolves the tension — advocate <i>and</i> infrastructure.</div>\n</header>\n\n<!-- THE BELIEF / WHY -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <div class=\"grid g2\" style=\"gap:48px;align-items:center\">\n      <div class=\"ph tall\"><span>DOCUMENTARY · wide studio scene, talent + engineer mid-session</span></div>\n      <div>\n        <p class=\"eyebrow\">Why we exist</p>\n        <h2>The demand came fast. The fairness didn't.</h2>\n        <p>AI created enormous demand for human voice — every accent, language, and shade of emotion. But the way that voice gets acquired is still fragmented and opaque, leaving talent confused and companies exposed.</p>\n        <p>We don't think the answer is to slow AI down. We think it's to build the licensing layer it was missing — the way Getty Images once did for photography.</p>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- WHAT WE ARE / ARE NOT -->\n<section class=\"page\">\n  <div class=\"grid g2\" style=\"gap:40px;align-items:start\">\n    <div>\n      <p class=\"eyebrow\">What we are</p>\n      <div style=\"display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✓</span><p style=\"margin:0\">A voice rights &amp; licensing platform</p></div>\n      <div style=\"display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✓</span><p style=\"margin:0\">An advocate for professional voice talent</p></div>\n      <div style=\"display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✓</span><p style=\"margin:0\">The trusted intermediary between talent &amp; AI</p></div>\n      <div style=\"display:flex;gap:14px;padding:14px 0\"><span class=\"num\">✓</span><p style=\"margin:0\">A standard for how voice should be licensed</p></div>\n    </div>\n    <div>\n      <p class=\"eyebrow\">What we're not</p>\n      <div style=\"display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✗</span><p class=\"small\" style=\"margin:0\">A talent agency</p></div>\n      <div style=\"display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✗</span><p class=\"small\" style=\"margin:0\">A recording studio</p></div>\n      <div style=\"display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✗</span><p class=\"small\" style=\"margin:0\">A voice cloning company</p></div>\n      <div style=\"display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">✗</span><p class=\"small\" style=\"margin:0\">A synthetic voice company</p></div>\n      <div style=\"display:flex;gap:14px;padding:14px 0\"><span class=\"num\">✗</span><p class=\"small\" style=\"margin:0\">An AI model company</p></div>\n    </div>\n  </div>\n  <div class=\"note\" style=\"margin-top:22px\"><b>Why include \"what we're not\":</b> straight from the doc — it's the sharpest way to hold positioning. Those things may be components of the business; they are not the business.</div>\n</section>\n\n<!-- FOUNDERS -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <p class=\"eyebrow\">The founders</p>\n    <h2>Two people, two halves of the same idea.</h2>\n    <div class=\"grid g2\" style=\"margin-top:28px;gap:32px\">\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div class=\"ph wide\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>PORTRAIT · Monika Podsiadło</span></div>\n        <div style=\"padding:28px\">\n          <h3 style=\"font-size:24px\">Monika Podsiadło</h3>\n          <p class=\"num\" style=\"margin:4px 0 14px\">Founder · the systems &amp; standards mind</p>\n          <p class=\"small\" style=\"margin:0\">Works at the intersection of voice technology, licensing, and data strategy. Thinks in systems, contracts, and long-term market evolution — focused on protecting talent and building a defensible business that changes the industry.</p>\n        </div>\n      </div>\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div class=\"ph wide\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>PORTRAIT · Andrew Rolfsen</span></div>\n        <div style=\"padding:28px\">\n          <h3 style=\"font-size:24px\">Andrew Rolfsen</h3>\n          <p class=\"num\" style=\"margin:4px 0 14px\">Founder · production &amp; the public voice</p>\n          <p class=\"small\" style=\"margin:0\">Lives closest to recording, audio quality, and the craft of building voice datasets. Translates technical voice concepts for everyone — and will be a recurring, human face of Moody Pines content.</p>\n        </div>\n      </div>\n    </div>\n    <div class=\"note\" style=\"margin-top:20px\"><b>Founder framing:</b> Monika = systems/standards, Andrew = production/education. Together they embody the tension the brand has to hold.</div>\n  </div>\n</section>\n\n<!-- THE TENSION, STATED -->\n<section class=\"bg-ink\">\n  <div class=\"page center\">\n    <p class=\"eyebrow\">What we want you to feel</p>\n    <h2 style=\"color:var(--paper);max-width:24ch;margin-left:auto;margin-right:auto\">\"They genuinely care about voice talent — and they're uniquely positioned to become the infrastructure for voice AI.\"</h2>\n    <p style=\"max-width:54ch;margin:18px auto 0\">That combination is the whole opportunity. We intend to earn both halves.</p>\n  </div>\n</section>\n\n<!-- CTA -->\n<section class=\"page center\">\n  <h2>Build the standard with us.</h2>\n  <p>Join the early-access list — as a voice professional, an AI company, or just someone who cares how this goes.</p>\n  <div style=\"display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap\">\n    <a class=\"btn\">Join early access</a>\n    <a class=\"btn btn-ghost\">Get in touch</a>\n  </div>\n</section>\n\n<!-- FOOTER -->\n<footer class=\"footer\">\n  <div class=\"page\">\n    <div>\n      <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n      <p class=\"small\" style=\"color:#7c7975;margin-top:14px;max-width:34ch\">The rights, licensing, and data infrastructure for voice in the AI era.</p>\n    </div>\n    <div><h4>For Talent</h4><a>Join the roster</a><a>How licensing works</a><a>Your rights</a></div>\n    <div><h4>For Companies</h4><a>Request access</a><a>Voice data</a><a>Provenance</a></div>\n    <div><h4>Company</h4><a>About</a><a>Founders</a><a>Contact</a></div>\n    <div class=\"fine\"><span>© 2026 Moody Pines</span><span>Privacy · Terms</span></div>\n  </div>\n</footer>\n\n\n</body>\n</html>\n"};

  'home-b.html':'Direction B — “The Manifesto” · editorial & typographic, strongest advocacy voice',

};
function render(src){

}
tabs.forEach(t => t.addEventListener('click', () => {
