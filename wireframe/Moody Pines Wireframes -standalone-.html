<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moody Pines — Wireframes</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');
:root{
  --paper:#f4f3f1;--paper-2:#ecebe8;--ink:#1c1b1a;--ink-2:#444240;--ink-3:#74716d;
  --line:#cfccc7;--accent:oklch(0.62 0.11 48);--font:'Archivo',system-ui,sans-serif;--mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--paper-2);color:var(--ink);display:flex;flex-direction:column;height:100vh;overflow:hidden}

.bar{display:flex;align-items:center;gap:18px;padding:11px 20px;background:var(--paper);border-bottom:1px solid var(--line);flex-wrap:wrap}
.bar .brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;letter-spacing:-.02em;white-space:nowrap}
.bar .brand .mark{width:0;height:0;border-left:8px solid transparent;border-right:8px solid transparent;border-bottom:16px solid var(--ink)}
.bar .label{font-family:var(--mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}

.group{display:flex;align-items:center;gap:6px;padding:4px;background:var(--paper-2);border:1px solid var(--line);border-radius:10px}
.group .gl{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:0 8px}
.tab{font-family:var(--font);font-size:13.5px;font-weight:600;color:var(--ink-2);background:transparent;border:0;padding:7px 13px;border-radius:7px;cursor:pointer;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab.active{background:var(--ink);color:var(--paper)}

.spacer{flex:1}
.toggle{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink-2);cursor:pointer;user-select:none;white-space:nowrap}
.toggle input{display:none}
.switch{width:38px;height:22px;border-radius:20px;background:var(--line);position:relative;transition:.18s}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.18s}
.toggle input:checked + .switch{background:var(--accent)}
.toggle input:checked + .switch::after{transform:translateX(16px)}
.dotmark{display:inline-block;width:9px;height:9px;border:1px dashed var(--accent);background:oklch(0.62 0.11 48 / 0.18);border-radius:2px}

.stage{flex:1;position:relative;background:var(--paper-2);overflow:hidden}
iframe{width:100%;height:100%;border:0;background:var(--paper);display:block}

.hint{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:6px 20px;background:var(--paper);border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(max-width:980px){.bar{gap:10px}.group .gl{display:none}}
</style>
</head>
<body>

<div class="bar">
  <div class="brand"><span class="mark"></span> Moody Pines</div>
  <span class="label">Wireframes · standalone</span>

  <div class="group" id="grp-home">
    <span class="gl">Homepage</span>
    <button class="tab" data-src="home-a.html">A · Booth</button>
    <button class="tab" data-src="home-b.html">B · Manifesto</button>
    <button class="tab" data-src="home-c.html">C · Marketplace</button>
    <button class="tab active" data-src="home-d.html">D · Combined</button>
  </div>

  <div class="group" id="grp-inner">
    <span class="gl">Pages</span>
    <button class="tab" data-src="for-talent.html">For Talent</button>
    <button class="tab" data-src="for-ai-companies.html">For AI Companies</button>
    <button class="tab" data-src="about.html">About</button>
  </div>

  <div class="spacer"></div>

  <label class="toggle">
    <input type="checkbox" id="notes" checked>
    <span class="switch"></span>
    <span><span class="dotmark"></span> Designer notes</span>
  </label>
</div>

<div class="stage">
  <iframe id="frame" src="home-d.html" title="Wireframe preview"></iframe>
</div>

<div class="hint">
  <span id="now">Direction D — “Combined” · working merge, building section by section</span>
  <span>Medium-fi · grayscale · real provisional copy · placeholder imagery</span>
</div>

<script>
const PAGES = {"home-a.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Moody Pines — Home A: Inside the Booth</title>\n<style>/* ============================================================\n   Moody Pines — Wireframe design language\n   Medium-fidelity, grayscale, real copy, placeholder imagery.\n   Annotations (designer notes) render in a single clay accent.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');\n\n:root{\n  --paper:#f4f3f1;\n  --paper-2:#ecebe8;\n  --card:#ffffff;\n  --ink:#1c1b1a;\n  --ink-2:#444240;\n  --ink-3:#74716d;\n  --line:#cfccc7;\n  --line-2:#dad7d2;\n  --fill:#dedbd6;       /* generic gray block */\n  --fill-2:#e7e4df;\n  --accent:oklch(0.62 0.11 48);     /* clay — used ONLY for designer annotations */\n  --accent-soft:oklch(0.62 0.11 48 / 0.12);\n  --radius:10px;\n  --maxw:1100px;\n  --font:'Archivo',system-ui,sans-serif;\n  --mono:'JetBrains Mono',ui-monospace,monospace;\n}\n\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:var(--font);\n  background:var(--paper);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  line-height:1.5;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\n\n/* ---------- faux browser chrome ---------- */\n.chrome{\n  display:flex;align-items:center;gap:14px;\n  padding:10px 16px;background:var(--paper-2);\n  border-bottom:1px solid var(--line);\n  position:sticky;top:0;z-index:50;\n}\n.chrome .dots{display:flex;gap:7px}\n.chrome .dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}\n.chrome .url{\n  font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  background:var(--card);border:1px solid var(--line);\n  padding:5px 12px;border-radius:20px;flex:1;max-width:360px;\n}\n\n/* ---------- site nav ---------- */\n.nav{\n  display:flex;align-items:center;justify-content:space-between;\n  gap:24px;padding:20px 40px;border-bottom:1px solid var(--line);\n  background:var(--paper);\n}\n.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}\n.brand .mark{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:18px solid var(--ink)}\n.nav .links{display:flex;gap:28px;font-size:15px;color:var(--ink-2);font-weight:500}\n.nav .links a:hover{color:var(--ink)}\n.nav-cta{display:flex;align-items:center;gap:14px}\n\n/* ---------- layout ---------- */\n.page{max-width:var(--maxw);margin:0 auto;padding:0 40px}\n.full{width:100%}\nsection{padding:72px 0}\n/* sections that ALSO carry .page for width must keep vertical padding\n   (.page's horizontal padding would otherwise override the section rule) */\nsection.page{padding-top:72px;padding-bottom:72px}\n.tight{padding:48px 0}\n.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase;margin:0 0 18px}\nh1{font-size:60px;line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 22px;text-wrap:balance}\nh2{font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;margin:0 0 16px;text-wrap:balance}\nh3{font-size:21px;line-height:1.2;letter-spacing:-.01em;font-weight:700;margin:0 0 8px}\np{margin:0 0 16px;color:var(--ink-2);font-size:17px;max-width:62ch}\n.lead{font-size:20px;color:var(--ink-2)}\n.small{font-size:14px;color:var(--ink-3)}\n.center{text-align:center}\n.center p{margin-left:auto;margin-right:auto}\n\n/* ---------- buttons (wireframe style) ---------- */\n.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:600;font-size:15px;\n  padding:13px 22px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}\n.btn-ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:9px 16px;font-size:14px}\n\n/* ---------- placeholder imagery ---------- */\n.ph{\n  position:relative;border-radius:var(--radius);overflow:hidden;\n  background:\n    repeating-linear-gradient(135deg,var(--fill) 0 11px,var(--fill-2) 11px 22px);\n  border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;text-align:center;\n}\n.ph span{\n  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);\n  background:var(--paper);padding:6px 12px;border-radius:6px;border:1px solid var(--line);\n  max-width:80%;line-height:1.4;\n}\n.ph.portrait{aspect-ratio:3/4}\n.ph.square{aspect-ratio:1/1}\n.ph.wide{aspect-ratio:16/9}\n.ph.tall{aspect-ratio:4/5}\n\n/* ---------- generic blocks ---------- */\n.grid{display:grid;gap:24px}\n.g2{grid-template-columns:repeat(2,1fr)}\n.g3{grid-template-columns:repeat(3,1fr)}\n.g4{grid-template-columns:repeat(4,1fr)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}\n.bar{height:10px;border-radius:6px;background:var(--fill);margin:7px 0}\n.bar.w80{width:80%}.bar.w60{width:60%}.bar.w40{width:40%}.bar.w90{width:90%}\n.divider{height:1px;background:var(--line);border:0;margin:0}\n.tag{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  border:1px solid var(--line);border-radius:20px;padding:4px 12px}\n.num{font-family:var(--mono);font-size:13px;color:var(--ink-3)}\n.bg-2{background:var(--paper-2)}\n.bg-ink{background:var(--ink);color:var(--paper)}\n.bg-ink p{color:#b9b6b2}.bg-ink .eyebrow{color:#8d8a86}\n\n/* ---------- comparison table (AI-company value props) ---------- */\n.cmp{display:grid;grid-template-columns:0.85fr 1.15fr 1.15fr;margin-top:30px;\n  border-top:1px solid var(--line);border-left:1px solid var(--line)}\n.cmp>div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}\n.cmp .corner{background:var(--paper-2)}\n.cmp .span{grid-column:2 / span 2;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;\n  text-transform:uppercase;color:var(--ink-3);background:var(--paper-2);text-align:center}\n.cmp .rowlabel{font-weight:700;color:var(--ink);background:var(--paper-2);display:flex;align-items:center;font-size:15px}\n.cmp .h{font-weight:700;font-size:15px;letter-spacing:-.01em}\n/* the highlighted Moody Pines column */\n.cmp .mp{background:var(--card);color:var(--ink);font-weight:500;\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink)}\n.cmp .mp.h{background:var(--ink);color:var(--paper);\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 2px 0 var(--ink)}\n.cmp .mp.last{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 -2px 0 var(--ink)}\n/* the muted traditional column */\n.cmp .trad{color:var(--ink-3)}\n.cmp .trad.h{color:var(--ink-2);background:var(--paper-2)}\n\n/* ---------- designer annotations (the only color) ---------- */\n.note{\n  position:relative;font-family:var(--mono);font-size:12.5px;line-height:1.45;\n  color:var(--accent);border:1px dashed var(--accent);background:var(--accent-soft);\n  border-radius:8px;padding:10px 14px 10px 30px;margin:0 0 22px;max-width:70ch;\n}\n.note::before{content:\"✱\";position:absolute;left:12px;top:9px;font-size:13px}\n.note b{font-weight:600}\n.no-notes .note{display:none}\n\n/* direction banner (top of each homepage variant) */\n.concept{\n  font-family:var(--mono);background:var(--accent);color:#fff;\n  padding:8px 40px;font-size:12.5px;letter-spacing:.03em;display:flex;gap:10px;align-items:center;\n}\n.concept b{font-weight:600}\n.no-notes .concept{display:none}\n\n/* ---------- footer ---------- */\n.footer{background:var(--ink);color:#b9b6b2;padding:56px 0 36px;margin-top:40px}\n.footer .page{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}\n.footer h4{color:var(--paper);font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;font-weight:500}\n.footer a{display:block;color:#b9b6b2;font-size:14px;margin-bottom:9px}\n.footer a:hover{color:var(--paper)}\n.footer .brand{color:var(--paper)}\n.footer .brand .mark{border-bottom-color:var(--paper)}\n.footer .fine{grid-column:1/-1;border-top:1px solid #3a3836;margin-top:28px;padding-top:20px;font-size:12.5px;color:#7c7975;display:flex;justify-content:space-between}\n\n/* ---------- responsive-ish ---------- */\n@media(max-width:880px){\n  h1{font-size:42px}h2{font-size:30px}\n  .g2,.g3,.g4{grid-template-columns:1fr}\n  .nav .links{display:none}\n  .footer .page{grid-template-columns:1fr 1fr}\n  .cmp{grid-template-columns:1fr 1fr;font-size:13px}\n  .cmp>div{padding:12px 12px}\n  .cmp .rowlabel{grid-column:1 / -1;background:var(--paper-2)}\n  .cmp .corner{display:none}\n  .cmp .span{grid-column:1 / -1}\n}\n</style>\n</head>\n<body>\n\n<div class=\"chrome\">\n  <div class=\"dots\"><i></i><i></i><i></i></div>\n  <div class=\"url\">moodypines.com</div>\n</div>\n\n<div class=\"concept\"><b>DIRECTION A · \"Inside the Booth\"</b> — Documentary-led. Opens on a human face mid-session. Advocacy first, platform proof follows. Closest to the Patreon \"creator-first\" feel.</div>\n\n<!-- NAV -->\n<nav class=\"nav\">\n  <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n  <div class=\"links\"><a>For Talent</a><a>For AI Companies</a><a>About</a></div>\n  <div class=\"nav-cta\"><a class=\"btn sm\">Join early access</a></div>\n</nav>\n\n<!-- HERO -->\n<header class=\"full\" style=\"position:relative\">\n  <div class=\"ph wide\" style=\"border-radius:0;border-left:0;border-right:0;border-top:0;height:620px;aspect-ratio:auto\">\n    <span>FULL-BLEED DOCUMENTARY PHOTO · voice actor in booth, headphones on, mid-take · warm, observational, real</span>\n  </div>\n  <div style=\"position:absolute;inset:0;display:flex;align-items:flex-end\">\n    <div class=\"page\" style=\"padding-bottom:56px\">\n      <div style=\"max-width:760px;background:linear-gradient(transparent,rgba(244,243,241,.0));\">\n        <p class=\"eyebrow\" style=\"color:var(--ink)\">Voice rights &amp; licensing · for the AI era</p>\n        <h1>The people behind the voices AI is learning from.</h1>\n        <p class=\"lead\" style=\"max-width:54ch;color:var(--ink)\">Moody Pines helps professional voice talent license their voices on their own terms — and helps AI companies acquire premium voice data they can actually trust.</p>\n        <div style=\"display:flex;gap:14px;margin-top:26px;flex-wrap:wrap\">\n          <a class=\"btn\">Join the early-access list</a>\n          <a class=\"btn btn-ghost\">See how it works</a>\n        </div>\n      </div>\n    </div>\n  </div>\n</header>\n\n<div class=\"page\">\n  <div class=\"note\" style=\"margin-top:30px\"><b>Hero rationale:</b> face first, headline second. No tech, no models, no benchmarks — a real person, premium and documentary. Waitlist CTA is primary throughout.</div>\n</div>\n\n<!-- THE PROBLEM -->\n<section class=\"page\">\n  <p class=\"eyebrow\">The problem</p>\n  <h2>AI created enormous demand for voice. The system to license it fairly was never built.</h2>\n  <p style=\"margin-bottom:40px\">Voice datasets are acquired through fragmented processes that leave everyone exposed — talent who lose control, and companies who inherit risk.</p>\n  <div class=\"grid g2\">\n    <div class=\"card\">\n      <span class=\"tag\">Voice talent fear</span>\n      <h3 style=\"margin-top:14px\">\"Where is my voice going?\"</h3>\n      <p class=\"small\">Ownership · Compensation · Future usage · Attribution · Long-term control. Today, none of it is clear.</p>\n    </div>\n    <div class=\"card\">\n      <span class=\"tag\">AI companies fear</span>\n      <h3 style=\"margin-top:14px\">\"Can we actually use this?\"</h3>\n      <p class=\"small\">Consent · Provenance · Rights management · Legal exposure · Litigation risk. The data is only as good as its paperwork.</p>\n    </div>\n  </div>\n  <div class=\"note\" style=\"margin-top:24px\"><b>Note:</b> two-sided framing kept short and parallel — establishes the marketplace without choosing a side.</div>\n</section>\n\n<!-- FEATURED VOICES (talent stories, surfaced early) -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px\">\n      <div>\n        <p class=\"eyebrow\">The roster</p>\n        <h2 style=\"margin:0\">Real voices. Real people. Real terms.</h2>\n      </div>\n      <a class=\"btn btn-ghost sm\">Meet the talent →</a>\n    </div>\n    <div class=\"note\" style=\"margin-top:18px\"><b>Why here:</b> talent stories placed high — the brand leads with humanity, not the platform diagram.</div>\n    <div class=\"grid g3\" style=\"margin-top:28px\">\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div class=\"ph portrait\" style=\"border-radius:0;border-left:0;border-right:0;border-top:0\"><span>PORTRAIT · narrator</span></div>\n        <div style=\"padding:22px\"><h3>Narrator · Documentary</h3><p class=\"small\" style=\"margin:0\">\"I finally know exactly what my voice is allowed to do — and what it isn't.\"</p></div>\n      </div>\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div class=\"ph portrait\" style=\"border-radius:0;border-left:0;border-right:0;border-top:0\"><span>PORTRAIT · broadcaster</span></div>\n        <div style=\"padding:22px\"><h3>Broadcaster · News</h3><p class=\"small\" style=\"margin:0\">\"A licensing model that treats my voice like the asset it is.\"</p></div>\n      </div>\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div class=\"ph portrait\" style=\"border-radius:0;border-left:0;border-right:0;border-top:0\"><span>PORTRAIT · character VO</span></div>\n        <div style=\"padding:22px\"><h3>Character &amp; Games</h3><p class=\"small\" style=\"margin:0\">\"Paid fairly, credited properly, and always in control.\"</p></div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- HOW IT WORKS -->\n<section class=\"page\">\n  <p class=\"eyebrow\">How it works</p>\n  <h2>The trusted layer between talent and AI.</h2>\n  <p style=\"margin-bottom:42px\">Think Getty Images, for voice. Talent become licensors. AI companies become licensees. Moody Pines is the intermediary that makes it safe for both.</p>\n  <div class=\"grid g3\">\n    <div>\n      <div class=\"num\">STEP 01</div>\n      <div class=\"ph wide\" style=\"margin:12px 0 16px\"><span>diagram · talent onboards</span></div>\n      <h3>Talent license their voice</h3>\n      <p class=\"small\">Professional voices join on clear, structured terms. They keep control and know exactly how their voice can be used.</p>\n    </div>\n    <div>\n      <div class=\"num\">STEP 02</div>\n      <div class=\"ph wide\" style=\"margin:12px 0 16px\"><span>diagram · rights + quality layer</span></div>\n      <h3>Moody Pines structures rights &amp; quality</h3>\n      <p class=\"small\">Standardized contracts, premium recording, provenance and consent tracked end to end.</p>\n    </div>\n    <div>\n      <div class=\"num\">STEP 03</div>\n      <div class=\"ph wide\" style=\"margin:12px 0 16px\"><span>diagram · AI company licenses</span></div>\n      <h3>AI companies license with confidence</h3>\n      <p class=\"small\">Buyers get premium voice data with clear rights and legal protection — ready to deploy.</p>\n    </div>\n  </div>\n</section>\n\n<!-- TRUST -->\n<section class=\"bg-ink\">\n  <div class=\"page\">\n    <p class=\"eyebrow\">Trust &amp; provenance</p>\n    <h2 style=\"color:var(--paper)\">Defensible by design.</h2>\n    <p style=\"max-width:60ch\">As AI grows more powerful, paperwork becomes the product. Consent, provenance, and rights management are built into every license — not bolted on after.</p>\n    <div class=\"grid g4\" style=\"margin-top:34px\">\n      <div><div class=\"num\" style=\"color:#8d8a86\">01</div><h3 style=\"color:var(--paper)\">Consent</h3><p class=\"small\" style=\"color:#b9b6b2\">Explicit, recorded, revocable.</p></div>\n      <div><div class=\"num\" style=\"color:#8d8a86\">02</div><h3 style=\"color:var(--paper)\">Provenance</h3><p class=\"small\" style=\"color:#b9b6b2\">Every dataset traceable to its source.</p></div>\n      <div><div class=\"num\" style=\"color:#8d8a86\">03</div><h3 style=\"color:var(--paper)\">Rights</h3><p class=\"small\" style=\"color:#b9b6b2\">Standardized, scalable contracts.</p></div>\n      <div><div class=\"num\" style=\"color:#8d8a86\">04</div><h3 style=\"color:var(--paper)\">Quality</h3><p class=\"small\" style=\"color:#b9b6b2\">Studio-grade recordings, vetted talent.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- CTA -->\n<section class=\"page center\">\n  <h2>Be first to license voice the right way.</h2>\n  <p>Join the early-access list — whether you're a voice professional or an AI company building what's next.</p>\n  <div style=\"display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap\">\n    <a class=\"btn\">I'm voice talent</a>\n    <a class=\"btn btn-ghost\">I'm an AI company</a>\n  </div>\n  <div class=\"note\" style=\"margin:26px auto 0;max-width:60ch;text-align:left\"><b>CTA note:</b> single waitlist, two doors. Splits the audience only at the point of conversion, not before.</div>\n</section>\n\n<!-- FOOTER -->\n<footer class=\"footer\">\n  <div class=\"page\">\n    <div>\n      <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n      <p class=\"small\" style=\"color:#7c7975;margin-top:14px;max-width:34ch\">The rights, licensing, and data infrastructure for voice in the AI era.</p>\n    </div>\n    <div><h4>For Talent</h4><a>Join the roster</a><a>How licensing works</a><a>Your rights</a></div>\n    <div><h4>For Companies</h4><a>Request access</a><a>Voice data</a><a>Provenance</a></div>\n    <div><h4>Company</h4><a>About</a><a>Founders</a><a>Contact</a></div>\n    <div class=\"fine\"><span>© 2026 Moody Pines</span><span>Privacy · Terms</span></div>\n  </div>\n</footer>\n\n\n</body>\n</html>\n","home-b.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Moody Pines — Home B: The Manifesto</title>\n<style>/* ============================================================\n   Moody Pines — Wireframe design language\n   Medium-fidelity, grayscale, real copy, placeholder imagery.\n   Annotations (designer notes) render in a single clay accent.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');\n\n:root{\n  --paper:#f4f3f1;\n  --paper-2:#ecebe8;\n  --card:#ffffff;\n  --ink:#1c1b1a;\n  --ink-2:#444240;\n  --ink-3:#74716d;\n  --line:#cfccc7;\n  --line-2:#dad7d2;\n  --fill:#dedbd6;       /* generic gray block */\n  --fill-2:#e7e4df;\n  --accent:oklch(0.62 0.11 48);     /* clay — used ONLY for designer annotations */\n  --accent-soft:oklch(0.62 0.11 48 / 0.12);\n  --radius:10px;\n  --maxw:1100px;\n  --font:'Archivo',system-ui,sans-serif;\n  --mono:'JetBrains Mono',ui-monospace,monospace;\n}\n\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:var(--font);\n  background:var(--paper);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  line-height:1.5;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\n\n/* ---------- faux browser chrome ---------- */\n.chrome{\n  display:flex;align-items:center;gap:14px;\n  padding:10px 16px;background:var(--paper-2);\n  border-bottom:1px solid var(--line);\n  position:sticky;top:0;z-index:50;\n}\n.chrome .dots{display:flex;gap:7px}\n.chrome .dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}\n.chrome .url{\n  font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  background:var(--card);border:1px solid var(--line);\n  padding:5px 12px;border-radius:20px;flex:1;max-width:360px;\n}\n\n/* ---------- site nav ---------- */\n.nav{\n  display:flex;align-items:center;justify-content:space-between;\n  gap:24px;padding:20px 40px;border-bottom:1px solid var(--line);\n  background:var(--paper);\n}\n.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}\n.brand .mark{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:18px solid var(--ink)}\n.nav .links{display:flex;gap:28px;font-size:15px;color:var(--ink-2);font-weight:500}\n.nav .links a:hover{color:var(--ink)}\n.nav-cta{display:flex;align-items:center;gap:14px}\n\n/* ---------- layout ---------- */\n.page{max-width:var(--maxw);margin:0 auto;padding:0 40px}\n.full{width:100%}\nsection{padding:72px 0}\n/* sections that ALSO carry .page for width must keep vertical padding\n   (.page's horizontal padding would otherwise override the section rule) */\nsection.page{padding-top:72px;padding-bottom:72px}\n.tight{padding:48px 0}\n.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase;margin:0 0 18px}\nh1{font-size:60px;line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 22px;text-wrap:balance}\nh2{font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;margin:0 0 16px;text-wrap:balance}\nh3{font-size:21px;line-height:1.2;letter-spacing:-.01em;font-weight:700;margin:0 0 8px}\np{margin:0 0 16px;color:var(--ink-2);font-size:17px;max-width:62ch}\n.lead{font-size:20px;color:var(--ink-2)}\n.small{font-size:14px;color:var(--ink-3)}\n.center{text-align:center}\n.center p{margin-left:auto;margin-right:auto}\n\n/* ---------- buttons (wireframe style) ---------- */\n.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:600;font-size:15px;\n  padding:13px 22px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}\n.btn-ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:9px 16px;font-size:14px}\n\n/* ---------- placeholder imagery ---------- */\n.ph{\n  position:relative;border-radius:var(--radius);overflow:hidden;\n  background:\n    repeating-linear-gradient(135deg,var(--fill) 0 11px,var(--fill-2) 11px 22px);\n  border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;text-align:center;\n}\n.ph span{\n  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);\n  background:var(--paper);padding:6px 12px;border-radius:6px;border:1px solid var(--line);\n  max-width:80%;line-height:1.4;\n}\n.ph.portrait{aspect-ratio:3/4}\n.ph.square{aspect-ratio:1/1}\n.ph.wide{aspect-ratio:16/9}\n.ph.tall{aspect-ratio:4/5}\n\n/* ---------- generic blocks ---------- */\n.grid{display:grid;gap:24px}\n.g2{grid-template-columns:repeat(2,1fr)}\n.g3{grid-template-columns:repeat(3,1fr)}\n.g4{grid-template-columns:repeat(4,1fr)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}\n.bar{height:10px;border-radius:6px;background:var(--fill);margin:7px 0}\n.bar.w80{width:80%}.bar.w60{width:60%}.bar.w40{width:40%}.bar.w90{width:90%}\n.divider{height:1px;background:var(--line);border:0;margin:0}\n.tag{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  border:1px solid var(--line);border-radius:20px;padding:4px 12px}\n.num{font-family:var(--mono);font-size:13px;color:var(--ink-3)}\n.bg-2{background:var(--paper-2)}\n.bg-ink{background:var(--ink);color:var(--paper)}\n.bg-ink p{color:#b9b6b2}.bg-ink .eyebrow{color:#8d8a86}\n\n/* ---------- comparison table (AI-company value props) ---------- */\n.cmp{display:grid;grid-template-columns:0.85fr 1.15fr 1.15fr;margin-top:30px;\n  border-top:1px solid var(--line);border-left:1px solid var(--line)}\n.cmp>div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}\n.cmp .corner{background:var(--paper-2)}\n.cmp .span{grid-column:2 / span 2;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;\n  text-transform:uppercase;color:var(--ink-3);background:var(--paper-2);text-align:center}\n.cmp .rowlabel{font-weight:700;color:var(--ink);background:var(--paper-2);display:flex;align-items:center;font-size:15px}\n.cmp .h{font-weight:700;font-size:15px;letter-spacing:-.01em}\n/* the highlighted Moody Pines column */\n.cmp .mp{background:var(--card);color:var(--ink);font-weight:500;\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink)}\n.cmp .mp.h{background:var(--ink);color:var(--paper);\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 2px 0 var(--ink)}\n.cmp .mp.last{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 -2px 0 var(--ink)}\n/* the muted traditional column */\n.cmp .trad{color:var(--ink-3)}\n.cmp .trad.h{color:var(--ink-2);background:var(--paper-2)}\n\n/* ---------- designer annotations (the only color) ---------- */\n.note{\n  position:relative;font-family:var(--mono);font-size:12.5px;line-height:1.45;\n  color:var(--accent);border:1px dashed var(--accent);background:var(--accent-soft);\n  border-radius:8px;padding:10px 14px 10px 30px;margin:0 0 22px;max-width:70ch;\n}\n.note::before{content:\"✱\";position:absolute;left:12px;top:9px;font-size:13px}\n.note b{font-weight:600}\n.no-notes .note{display:none}\n\n/* direction banner (top of each homepage variant) */\n.concept{\n  font-family:var(--mono);background:var(--accent);color:#fff;\n  padding:8px 40px;font-size:12.5px;letter-spacing:.03em;display:flex;gap:10px;align-items:center;\n}\n.concept b{font-weight:600}\n.no-notes .concept{display:none}\n\n/* ---------- footer ---------- */\n.footer{background:var(--ink);color:#b9b6b2;padding:56px 0 36px;margin-top:40px}\n.footer .page{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}\n.footer h4{color:var(--paper);font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;font-weight:500}\n.footer a{display:block;color:#b9b6b2;font-size:14px;margin-bottom:9px}\n.footer a:hover{color:var(--paper)}\n.footer .brand{color:var(--paper)}\n.footer .brand .mark{border-bottom-color:var(--paper)}\n.footer .fine{grid-column:1/-1;border-top:1px solid #3a3836;margin-top:28px;padding-top:20px;font-size:12.5px;color:#7c7975;display:flex;justify-content:space-between}\n\n/* ---------- responsive-ish ---------- */\n@media(max-width:880px){\n  h1{font-size:42px}h2{font-size:30px}\n  .g2,.g3,.g4{grid-template-columns:1fr}\n  .nav .links{display:none}\n  .footer .page{grid-template-columns:1fr 1fr}\n  .cmp{grid-template-columns:1fr 1fr;font-size:13px}\n  .cmp>div{padding:12px 12px}\n  .cmp .rowlabel{grid-column:1 / -1;background:var(--paper-2)}\n  .cmp .corner{display:none}\n  .cmp .span{grid-column:1 / -1}\n}\n</style>\n</head>\n<body>\n\n<div class=\"chrome\">\n  <div class=\"dots\"><i></i><i></i><i></i></div>\n  <div class=\"url\">moodypines.com</div>\n</div>\n\n<div class=\"concept\"><b>DIRECTION B · \"The Manifesto\"</b> — Editorial, typographic. A bold spoken stance leads; imagery supports. Strongest advocacy voice — a pledge to talent that earns the platform's credibility.</div>\n\n<!-- NAV -->\n<nav class=\"nav\">\n  <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n  <div class=\"links\"><a>For Talent</a><a>For AI Companies</a><a>About</a></div>\n  <div class=\"nav-cta\"><a class=\"btn sm\">Join early access</a></div>\n</nav>\n\n<!-- HERO: typographic manifesto -->\n<header class=\"page\" style=\"padding-top:90px;padding-bottom:40px\">\n  <p class=\"eyebrow\">A Moody Pines manifesto</p>\n  <h1 style=\"font-size:78px;max-width:18ch\">Your voice is yours. Even now.</h1>\n  <p class=\"lead\" style=\"max-width:56ch;margin-top:8px\">AI learned to speak from human voices. The people who gave it speech deserve to be paid, credited, and in control. We're building the infrastructure to make that the standard — not the exception.</p>\n  <div style=\"display:flex;gap:14px;margin-top:30px;flex-wrap:wrap\">\n    <a class=\"btn\">Join the early-access list</a>\n    <a class=\"btn btn-ghost\">Read our position</a>\n  </div>\n  <div class=\"note\" style=\"margin-top:30px\"><b>Hero rationale:</b> no hero image — the words ARE the design. Reads as a stance, not a sales page. Risk: leans advocate; we balance it with the platform proof directly below.</div>\n</header>\n\n<!-- thin documentary strip -->\n<div class=\"page\">\n  <div class=\"ph\" style=\"height:240px;aspect-ratio:auto\"><span>WIDE DOCUMENTARY STRIP · hands at a mixing desk, mic, headphones — texture, not portrait</span></div>\n</div>\n\n<!-- THE PLEDGE -->\n<section class=\"page\">\n  <p class=\"eyebrow\">What we stand for</p>\n  <div class=\"grid g2\" style=\"gap:40px;align-items:start\">\n    <h2 style=\"margin:0\">Five promises we make to every voice on the platform.</h2>\n    <div>\n      <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">01</span><div><h3>You get paid</h3><p class=\"small\" style=\"margin:0\">Clear, fair compensation for every license.</p></div></div>\n      <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">02</span><div><h3>You stay in control</h3><p class=\"small\" style=\"margin:0\">You decide what your voice can and can't be used for.</p></div></div>\n      <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">03</span><div><h3>You're credited</h3><p class=\"small\" style=\"margin:0\">Attribution travels with your voice.</p></div></div>\n      <div style=\"display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)\"><span class=\"num\">04</span><div><h3>You can see everything</h3><p class=\"small\" style=\"margin:0\">Full transparency on usage, always.</p></div></div>\n      <div style=\"display:flex;gap:16px;padding:16px 0\"><span class=\"num\">05</span><div><h3>You can walk away</h3><p class=\"small\" style=\"margin:0\">Consent is revocable. Your terms, your call.</p></div></div>\n    </div>\n  </div>\n</section>\n\n<!-- TALENT STORIES — big gallery -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <p class=\"eyebrow\">The voices</p>\n    <h2>Listen to the people, not the pitch.</h2>\n    <div class=\"note\"><b>Why a big gallery:</b> in the manifesto direction, talent faces are the proof. Mix of pull-quotes + portraits, editorial rhythm.</div>\n    <div class=\"grid g2\" style=\"margin-top:28px;gap:24px\">\n      <div class=\"card\" style=\"padding:34px\"><h3 style=\"font-size:26px;line-height:1.25;font-weight:700\">\"For the first time, a company asked permission before using my voice — and meant it.\"</h3><p class=\"small\" style=\"margin-top:18px\">— Narrator, 20 years in audiobooks</p></div>\n      <div class=\"ph tall\"><span>PORTRAIT · talent in booth</span></div>\n      <div class=\"ph tall\"><span>PORTRAIT · engineer + talent</span></div>\n      <div class=\"card\" style=\"padding:34px\"><h3 style=\"font-size:26px;line-height:1.25;font-weight:700\">\"This is what a fair deal in the AI era should look like.\"</h3><p class=\"small\" style=\"margin-top:18px\">— Broadcast voice &amp; commercial VO</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- THE PROBLEM as editorial -->\n<section class=\"page\">\n  <div class=\"grid g2\" style=\"gap:48px;align-items:center\">\n    <div>\n      <p class=\"eyebrow\">Why now</p>\n      <h2>The demand is here. The rules aren't.</h2>\n      <p>AI created enormous demand for human voice — accents, languages, emotional range, conversational nuance. But most voice data is still acquired through fragmented deals that leave talent confused and companies exposed.</p>\n      <p>We think the answer isn't slowing AI down. It's building the licensing layer it was missing.</p>\n    </div>\n    <div class=\"card bg-ink\" style=\"padding:34px\">\n      <p class=\"eyebrow\">The Getty Images parallel</p>\n      <p style=\"color:#cfccc7;font-size:18px\">Before Getty, photographers couldn't license at scale. Getty built the marketplace, the contracts, the trust — and everyone won.</p>\n      <p style=\"color:var(--paper);font-weight:600;margin:0\">Moody Pines is building that framework for voice.</p>\n    </div>\n  </div>\n</section>\n\n<!-- HOW IT WORKS (condensed) -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <p class=\"eyebrow\">How it works</p>\n    <h2>Three roles. One trusted layer.</h2>\n    <div class=\"grid g3\" style=\"margin-top:26px\">\n      <div class=\"card\"><div class=\"num\">LICENSORS</div><h3 style=\"margin-top:8px\">Voice talent</h3><p class=\"small\">Contribute premium voice on clear terms.</p></div>\n      <div class=\"card\"><div class=\"num\">INTERMEDIARY</div><h3 style=\"margin-top:8px\">Moody Pines</h3><p class=\"small\">Rights, quality, provenance, trust.</p></div>\n      <div class=\"card\"><div class=\"num\">LICENSEES</div><h3 style=\"margin-top:8px\">AI companies</h3><p class=\"small\">License voice data they can defend.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- CTA -->\n<section class=\"page center\">\n  <h2 style=\"font-size:46px\">Help us set the standard.</h2>\n  <p>Add your name to the early-access list and be part of the first fair marketplace for voice.</p>\n  <div style=\"display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap\">\n    <a class=\"btn\">Join the early-access list</a>\n  </div>\n</section>\n\n<!-- FOOTER -->\n<footer class=\"footer\">\n  <div class=\"page\">\n    <div>\n      <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n      <p class=\"small\" style=\"color:#7c7975;margin-top:14px;max-width:34ch\">The rights, licensing, and data infrastructure for voice in the AI era.</p>\n    </div>\n    <div><h4>For Talent</h4><a>Join the roster</a><a>How licensing works</a><a>Your rights</a></div>\n    <div><h4>For Companies</h4><a>Request access</a><a>Voice data</a><a>Provenance</a></div>\n    <div><h4>Company</h4><a>About</a><a>Founders</a><a>Contact</a></div>\n    <div class=\"fine\"><span>© 2026 Moody Pines</span><span>Privacy · Terms</span></div>\n  </div>\n</footer>\n\n\n</body>\n</html>\n","home-c.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Moody Pines — Home C: The Marketplace</title>\n<style>/* ============================================================\n   Moody Pines — Wireframe design language\n   Medium-fidelity, grayscale, real copy, placeholder imagery.\n   Annotations (designer notes) render in a single clay accent.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');\n\n:root{\n  --paper:#f4f3f1;\n  --paper-2:#ecebe8;\n  --card:#ffffff;\n  --ink:#1c1b1a;\n  --ink-2:#444240;\n  --ink-3:#74716d;\n  --line:#cfccc7;\n  --line-2:#dad7d2;\n  --fill:#dedbd6;       /* generic gray block */\n  --fill-2:#e7e4df;\n  --accent:oklch(0.62 0.11 48);     /* clay — used ONLY for designer annotations */\n  --accent-soft:oklch(0.62 0.11 48 / 0.12);\n  --radius:10px;\n  --maxw:1100px;\n  --font:'Archivo',system-ui,sans-serif;\n  --mono:'JetBrains Mono',ui-monospace,monospace;\n}\n\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:var(--font);\n  background:var(--paper);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  line-height:1.5;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\n\n/* ---------- faux browser chrome ---------- */\n.chrome{\n  display:flex;align-items:center;gap:14px;\n  padding:10px 16px;background:var(--paper-2);\n  border-bottom:1px solid var(--line);\n  position:sticky;top:0;z-index:50;\n}\n.chrome .dots{display:flex;gap:7px}\n.chrome .dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}\n.chrome .url{\n  font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  background:var(--card);border:1px solid var(--line);\n  padding:5px 12px;border-radius:20px;flex:1;max-width:360px;\n}\n\n/* ---------- site nav ---------- */\n.nav{\n  display:flex;align-items:center;justify-content:space-between;\n  gap:24px;padding:20px 40px;border-bottom:1px solid var(--line);\n  background:var(--paper);\n}\n.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}\n.brand .mark{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:18px solid var(--ink)}\n.nav .links{display:flex;gap:28px;font-size:15px;color:var(--ink-2);font-weight:500}\n.nav .links a:hover{color:var(--ink)}\n.nav-cta{display:flex;align-items:center;gap:14px}\n\n/* ---------- layout ---------- */\n.page{max-width:var(--maxw);margin:0 auto;padding:0 40px}\n.full{width:100%}\nsection{padding:72px 0}\n/* sections that ALSO carry .page for width must keep vertical padding\n   (.page's horizontal padding would otherwise override the section rule) */\nsection.page{padding-top:72px;padding-bottom:72px}\n.tight{padding:48px 0}\n.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase;margin:0 0 18px}\nh1{font-size:60px;line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 22px;text-wrap:balance}\nh2{font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;margin:0 0 16px;text-wrap:balance}\nh3{font-size:21px;line-height:1.2;letter-spacing:-.01em;font-weight:700;margin:0 0 8px}\np{margin:0 0 16px;color:var(--ink-2);font-size:17px;max-width:62ch}\n.lead{font-size:20px;color:var(--ink-2)}\n.small{font-size:14px;color:var(--ink-3)}\n.center{text-align:center}\n.center p{margin-left:auto;margin-right:auto}\n\n/* ---------- buttons (wireframe style) ---------- */\n.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:600;font-size:15px;\n  padding:13px 22px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}\n.btn-ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:9px 16px;font-size:14px}\n\n/* ---------- placeholder imagery ---------- */\n.ph{\n  position:relative;border-radius:var(--radius);overflow:hidden;\n  background:\n    repeating-linear-gradient(135deg,var(--fill) 0 11px,var(--fill-2) 11px 22px);\n  border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;text-align:center;\n}\n.ph span{\n  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);\n  background:var(--paper);padding:6px 12px;border-radius:6px;border:1px solid var(--line);\n  max-width:80%;line-height:1.4;\n}\n.ph.portrait{aspect-ratio:3/4}\n.ph.square{aspect-ratio:1/1}\n.ph.wide{aspect-ratio:16/9}\n.ph.tall{aspect-ratio:4/5}\n\n/* ---------- generic blocks ---------- */\n.grid{display:grid;gap:24px}\n.g2{grid-template-columns:repeat(2,1fr)}\n.g3{grid-template-columns:repeat(3,1fr)}\n.g4{grid-template-columns:repeat(4,1fr)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}\n.bar{height:10px;border-radius:6px;background:var(--fill);margin:7px 0}\n.bar.w80{width:80%}.bar.w60{width:60%}.bar.w40{width:40%}.bar.w90{width:90%}\n.divider{height:1px;background:var(--line);border:0;margin:0}\n.tag{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  border:1px solid var(--line);border-radius:20px;padding:4px 12px}\n.num{font-family:var(--mono);font-size:13px;color:var(--ink-3)}\n.bg-2{background:var(--paper-2)}\n.bg-ink{background:var(--ink);color:var(--paper)}\n.bg-ink p{color:#b9b6b2}.bg-ink .eyebrow{color:#8d8a86}\n\n/* ---------- comparison table (AI-company value props) ---------- */\n.cmp{display:grid;grid-template-columns:0.85fr 1.15fr 1.15fr;margin-top:30px;\n  border-top:1px solid var(--line);border-left:1px solid var(--line)}\n.cmp>div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}\n.cmp .corner{background:var(--paper-2)}\n.cmp .span{grid-column:2 / span 2;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;\n  text-transform:uppercase;color:var(--ink-3);background:var(--paper-2);text-align:center}\n.cmp .rowlabel{font-weight:700;color:var(--ink);background:var(--paper-2);display:flex;align-items:center;font-size:15px}\n.cmp .h{font-weight:700;font-size:15px;letter-spacing:-.01em}\n/* the highlighted Moody Pines column */\n.cmp .mp{background:var(--card);color:var(--ink);font-weight:500;\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink)}\n.cmp .mp.h{background:var(--ink);color:var(--paper);\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 2px 0 var(--ink)}\n.cmp .mp.last{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 -2px 0 var(--ink)}\n/* the muted traditional column */\n.cmp .trad{color:var(--ink-3)}\n.cmp .trad.h{color:var(--ink-2);background:var(--paper-2)}\n\n/* ---------- designer annotations (the only color) ---------- */\n.note{\n  position:relative;font-family:var(--mono);font-size:12.5px;line-height:1.45;\n  color:var(--accent);border:1px dashed var(--accent);background:var(--accent-soft);\n  border-radius:8px;padding:10px 14px 10px 30px;margin:0 0 22px;max-width:70ch;\n}\n.note::before{content:\"✱\";position:absolute;left:12px;top:9px;font-size:13px}\n.note b{font-weight:600}\n.no-notes .note{display:none}\n\n/* direction banner (top of each homepage variant) */\n.concept{\n  font-family:var(--mono);background:var(--accent);color:#fff;\n  padding:8px 40px;font-size:12.5px;letter-spacing:.03em;display:flex;gap:10px;align-items:center;\n}\n.concept b{font-weight:600}\n.no-notes .concept{display:none}\n\n/* ---------- footer ---------- */\n.footer{background:var(--ink);color:#b9b6b2;padding:56px 0 36px;margin-top:40px}\n.footer .page{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}\n.footer h4{color:var(--paper);font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;font-weight:500}\n.footer a{display:block;color:#b9b6b2;font-size:14px;margin-bottom:9px}\n.footer a:hover{color:var(--paper)}\n.footer .brand{color:var(--paper)}\n.footer .brand .mark{border-bottom-color:var(--paper)}\n.footer .fine{grid-column:1/-1;border-top:1px solid #3a3836;margin-top:28px;padding-top:20px;font-size:12.5px;color:#7c7975;display:flex;justify-content:space-between}\n\n/* ---------- responsive-ish ---------- */\n@media(max-width:880px){\n  h1{font-size:42px}h2{font-size:30px}\n  .g2,.g3,.g4{grid-template-columns:1fr}\n  .nav .links{display:none}\n  .footer .page{grid-template-columns:1fr 1fr}\n  .cmp{grid-template-columns:1fr 1fr;font-size:13px}\n  .cmp>div{padding:12px 12px}\n  .cmp .rowlabel{grid-column:1 / -1;background:var(--paper-2)}\n  .cmp .corner{display:none}\n  .cmp .span{grid-column:1 / -1}\n}\n</style>\n</head>\n<body>\n\n<div class=\"chrome\">\n  <div class=\"dots\"><i></i><i></i><i></i></div>\n  <div class=\"url\">moodypines.com</div>\n</div>\n\n<div class=\"concept\"><b>DIRECTION C · \"The Marketplace\"</b> — Platform-forward but human-fronted. Opens on a person, then makes the two-sided marketplace + Getty parallel the structural spine. Most \"credible infrastructure\" of the three; conversion split lives in the hero.</div>\n\n<!-- NAV -->\n<nav class=\"nav\">\n  <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n  <div class=\"links\"><a>For Talent</a><a>For AI Companies</a><a>How it works</a><a>About</a></div>\n  <div class=\"nav-cta\"><a class=\"btn sm\">Join early access</a></div>\n</nav>\n\n<!-- HERO: human image + two-door entry -->\n<header class=\"page\" style=\"padding-top:64px;padding-bottom:24px\">\n  <div class=\"grid g2\" style=\"gap:48px;align-items:center\">\n    <div>\n      <p class=\"eyebrow\">Voice rights &amp; licensing · for the AI era</p>\n      <h1 style=\"font-size:56px\">The marketplace for voice in the age of AI.</h1>\n      <p class=\"lead\" style=\"max-width:50ch\">Moody Pines is where professional voice talent license their voices on fair terms — and where AI companies acquire premium voice data they can legally stand behind.</p>\n      <div class=\"note\" style=\"margin-top:22px\"><b>Hero rationale:</b> still opens on a human face (left), but the headline names the <i>marketplace</i> and the two doors appear immediately. This is the most platform-credible of the three — closest to \"infrastructure,\" furthest from \"agency.\"</div>\n      <!-- two-door entry -->\n      <div class=\"grid g2\" style=\"gap:16px;margin-top:18px\">\n        <a class=\"card\" style=\"display:block;padding:22px\">\n          <span class=\"tag\">I'm voice talent</span>\n          <h3 style=\"margin:14px 0 6px\">License my voice →</h3>\n          <p class=\"small\" style=\"margin:0\">Get paid, stay in control.</p>\n        </a>\n        <a class=\"card\" style=\"display:block;padding:22px\">\n          <span class=\"tag\">I'm an AI company</span>\n          <h3 style=\"margin:14px 0 6px\">Acquire voice data →</h3>\n          <p class=\"small\" style=\"margin:0\">Premium, licensed, defensible.</p>\n        </a>\n      </div>\n    </div>\n    <div class=\"ph portrait\" style=\"height:560px;aspect-ratio:auto\"><span>DOCUMENTARY PORTRAIT · talent in booth, headphones, mid-session · warm + real (not a polished headshot)</span></div>\n  </div>\n</header>\n\n<!-- TRUST STRIP / logos -->\n<section class=\"tight bg-2\">\n  <div class=\"page center\">\n    <p class=\"small\" style=\"margin:0 0 18px\">Building the licensing layer trusted across the voice + AI ecosystem</p>\n    <div class=\"grid g4\" style=\"gap:18px\">\n      <div class=\"ph\" style=\"height:54px;aspect-ratio:auto\"><span>partner / press logo</span></div>\n      <div class=\"ph\" style=\"height:54px;aspect-ratio:auto\"><span>partner / press logo</span></div>\n      <div class=\"ph\" style=\"height:54px;aspect-ratio:auto\"><span>partner / press logo</span></div>\n      <div class=\"ph\" style=\"height:54px;aspect-ratio:auto\"><span>partner / press logo</span></div>\n    </div>\n    <div class=\"note\" style=\"margin:18px auto 0;max-width:60ch\"><b>Placeholder:</b> logo/press strip is optional — only ship it once there's real proof. Cut entirely if it would feel thin at launch.</div>\n  </div>\n</section>\n\n<!-- THE MARKETPLACE DIAGRAM (the spine) -->\n<section class=\"page\">\n  <p class=\"eyebrow\">The marketplace</p>\n  <h2>Two sides. One trusted layer between them.</h2>\n  <p style=\"margin-bottom:38px\">Talent become licensors. AI companies become licensees. Moody Pines is the intermediary that makes the exchange safe, fair, and scalable for both.</p>\n  <div class=\"grid\" style=\"grid-template-columns:1fr auto 1fr;gap:24px;align-items:stretch\">\n    <div class=\"card\">\n      <span class=\"tag\">Supply</span>\n      <h3 style=\"margin-top:14px\">Voice talent</h3>\n      <p class=\"small\">Actors, narrators, broadcasters, entertainers, specialized performers — contributing premium voice datasets on clear terms.</p>\n      <hr class=\"divider\" style=\"margin:16px 0\">\n      <p class=\"small\" style=\"margin:0\"><b>They want:</b> fair pay, control, attribution, trust.</p>\n    </div>\n    <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:170px\">\n      <div class=\"ph square\" style=\"width:150px;height:150px;aspect-ratio:auto\"><span>MOODY PINES · rights · quality · provenance</span></div>\n      <div class=\"num\">the intermediary</div>\n    </div>\n    <div class=\"card\">\n      <span class=\"tag\">Demand</span>\n      <h3 style=\"margin-top:14px\">AI companies</h3>\n      <p class=\"small\">Frontier labs, voice startups, consumer AI, agents, enterprise — needing voice data they can deploy with confidence.</p>\n      <hr class=\"divider\" style=\"margin:16px 0\">\n      <p class=\"small\" style=\"margin:0\"><b>They want:</b> quality, clear rights, legal protection, speed.</p>\n    </div>\n  </div>\n  <div class=\"note\" style=\"margin-top:22px\"><b>Why lead with the diagram:</b> Direction C earns credibility by showing the <i>structure</i> early. The human story (below) then makes it feel warm rather than mechanical.</div>\n</section>\n\n<!-- GETTY PARALLEL -->\n<section class=\"bg-ink\">\n  <div class=\"page\">\n    <div class=\"grid g2\" style=\"gap:48px;align-items:center\">\n      <div>\n        <p class=\"eyebrow\">The Getty Images parallel</p>\n        <h2 style=\"color:var(--paper)\">We've seen this pattern before.</h2>\n        <p style=\"max-width:54ch\">Before Getty Images, photographers couldn't license their work at scale. Getty built the marketplace, the standardized contracts, and the trust — and both creators and buyers won.</p>\n        <p style=\"color:var(--paper);font-weight:600;max-width:54ch\">Moody Pines is building that same framework for voice.</p>\n      </div>\n      <div class=\"ph wide\"><span>SIMPLE PARALLEL DIAGRAM · \"Getty : photos :: Moody Pines : voice\"</span></div>\n    </div>\n  </div>\n</section>\n\n<!-- TALENT STORIES -->\n<section class=\"page\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px\">\n    <div><p class=\"eyebrow\">The roster</p><h2 style=\"margin:0\">Premium voice means premium people.</h2></div>\n    <a class=\"btn btn-ghost sm\">Meet the talent →</a>\n  </div>\n  <div class=\"grid g3\" style=\"margin-top:28px\">\n    <div class=\"card\" style=\"padding:0;overflow:hidden\">\n      <div class=\"ph portrait\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>PORTRAIT · narrator</span></div>\n      <div style=\"padding:22px\"><h3>Documentary narrator</h3><p class=\"small\" style=\"margin:0\">\"I know exactly what my voice can do — and what it can't.\"</p></div>\n    </div>\n    <div class=\"card\" style=\"padding:0;overflow:hidden\">\n      <div class=\"ph portrait\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>PORTRAIT · broadcaster</span></div>\n      <div style=\"padding:22px\"><h3>Broadcast voice</h3><p class=\"small\" style=\"margin:0\">\"A model that treats my voice like the asset it is.\"</p></div>\n    </div>\n    <div class=\"card\" style=\"padding:0;overflow:hidden\">\n      <div class=\"ph portrait\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>PORTRAIT · character VO</span></div>\n      <div style=\"padding:22px\"><h3>Character &amp; games</h3><p class=\"small\" style=\"margin:0\">\"Paid fairly, credited properly, always in control.\"</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- TRUST / DEFENSIBILITY -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <p class=\"eyebrow\">Trust &amp; provenance</p>\n    <h2>As AI gets more powerful, the paperwork becomes the product.</h2>\n    <p style=\"margin-bottom:32px;max-width:62ch\">Consent, provenance, and rights management are built into every license — so buyers can deploy without inheriting risk, and talent always know where their voice stands.</p>\n    <div class=\"grid g4\">\n      <div class=\"card\"><div class=\"num\">01</div><h3 style=\"margin-top:8px\">Consent</h3><p class=\"small\" style=\"margin:0\">Explicit, recorded, revocable.</p></div>\n      <div class=\"card\"><div class=\"num\">02</div><h3 style=\"margin-top:8px\">Provenance</h3><p class=\"small\" style=\"margin:0\">Every dataset traceable to source.</p></div>\n      <div class=\"card\"><div class=\"num\">03</div><h3 style=\"margin-top:8px\">Rights</h3><p class=\"small\" style=\"margin:0\">Standardized, scalable contracts.</p></div>\n      <div class=\"card\"><div class=\"num\">04</div><h3 style=\"margin-top:8px\">Quality</h3><p class=\"small\" style=\"margin:0\">Studio-grade, vetted talent.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- CTA -->\n<section class=\"page center\">\n  <h2>Get early access.</h2>\n  <p>Join the list — whether you're lending your voice or building what speaks next.</p>\n  <div style=\"display:flex;gap:14px;justify-content:center;margin-top:24px;flex-wrap:wrap\">\n    <a class=\"btn\">I'm voice talent</a>\n    <a class=\"btn btn-ghost\">I'm an AI company</a>\n  </div>\n</section>\n\n<!-- FOOTER -->\n<footer class=\"footer\">\n  <div class=\"page\">\n    <div>\n      <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n      <p class=\"small\" style=\"color:#7c7975;margin-top:14px;max-width:34ch\">The rights, licensing, and data infrastructure for voice in the AI era.</p>\n    </div>\n    <div><h4>For Talent</h4><a>Join the roster</a><a>How licensing works</a><a>Your rights</a></div>\n    <div><h4>For Companies</h4><a>Request access</a><a>Voice data</a><a>Provenance</a></div>\n    <div><h4>Company</h4><a>About</a><a>Founders</a><a>Contact</a></div>\n    <div class=\"fine\"><span>© 2026 Moody Pines</span><span>Privacy · Terms</span></div>\n  </div>\n</footer>\n\n\n</body>\n</html>\n","home-d.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Moody Pines — Home D: Combined</title>\n<style>/* ============================================================\n   Moody Pines — Wireframe design language\n   Medium-fidelity, grayscale, real copy, placeholder imagery.\n   Annotations (designer notes) render in a single clay accent.\n   ============================================================ */\n\n@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap');\n\n:root{\n  --paper:#f4f3f1;\n  --paper-2:#ecebe8;\n  --card:#ffffff;\n  --ink:#1c1b1a;\n  --ink-2:#444240;\n  --ink-3:#74716d;\n  --line:#cfccc7;\n  --line-2:#dad7d2;\n  --fill:#dedbd6;       /* generic gray block */\n  --fill-2:#e7e4df;\n  --accent:oklch(0.62 0.11 48);     /* clay — used ONLY for designer annotations */\n  --accent-soft:oklch(0.62 0.11 48 / 0.12);\n  --radius:10px;\n  --maxw:1100px;\n  --font:'Archivo',system-ui,sans-serif;\n  --mono:'JetBrains Mono',ui-monospace,monospace;\n}\n\n*{box-sizing:border-box}\nhtml,body{margin:0;padding:0}\nbody{\n  font-family:var(--font);\n  background:var(--paper);\n  color:var(--ink);\n  -webkit-font-smoothing:antialiased;\n  line-height:1.5;\n}\nimg{max-width:100%;display:block}\na{color:inherit;text-decoration:none}\n\n/* ---------- faux browser chrome ---------- */\n.chrome{\n  display:flex;align-items:center;gap:14px;\n  padding:10px 16px;background:var(--paper-2);\n  border-bottom:1px solid var(--line);\n  position:sticky;top:0;z-index:50;\n}\n.chrome .dots{display:flex;gap:7px}\n.chrome .dots i{width:11px;height:11px;border-radius:50%;background:var(--line);display:block}\n.chrome .url{\n  font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  background:var(--card);border:1px solid var(--line);\n  padding:5px 12px;border-radius:20px;flex:1;max-width:360px;\n}\n\n/* ---------- site nav ---------- */\n.nav{\n  display:flex;align-items:center;justify-content:space-between;\n  gap:24px;padding:20px 40px;border-bottom:1px solid var(--line);\n  background:var(--paper);\n}\n.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.02em}\n.brand .mark{width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:18px solid var(--ink)}\n.nav .links{display:flex;gap:28px;font-size:15px;color:var(--ink-2);font-weight:500}\n.nav .links a:hover{color:var(--ink)}\n.nav-cta{display:flex;align-items:center;gap:14px}\n\n/* ---------- layout ---------- */\n.page{max-width:var(--maxw);margin:0 auto;padding:0 40px}\n.full{width:100%}\nsection{padding:72px 0}\n/* sections that ALSO carry .page for width must keep vertical padding\n   (.page's horizontal padding would otherwise override the section rule) */\nsection.page{padding-top:72px;padding-bottom:72px}\n.tight{padding:48px 0}\n.eyebrow{font-family:var(--mono);font-size:13px;letter-spacing:.04em;color:var(--ink-3);text-transform:uppercase;margin:0 0 18px}\nh1{font-size:60px;line-height:1.02;letter-spacing:-.03em;font-weight:800;margin:0 0 22px;text-wrap:balance}\nh2{font-size:38px;line-height:1.08;letter-spacing:-.02em;font-weight:700;margin:0 0 16px;text-wrap:balance}\nh3{font-size:21px;line-height:1.2;letter-spacing:-.01em;font-weight:700;margin:0 0 8px}\np{margin:0 0 16px;color:var(--ink-2);font-size:17px;max-width:62ch}\n.lead{font-size:20px;color:var(--ink-2)}\n.small{font-size:14px;color:var(--ink-3)}\n.center{text-align:center}\n.center p{margin-left:auto;margin-right:auto}\n\n/* ---------- buttons (wireframe style) ---------- */\n.btn{display:inline-flex;align-items:center;gap:8px;font-family:var(--font);font-weight:600;font-size:15px;\n  padding:13px 22px;border-radius:8px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}\n.btn-ghost{background:transparent;color:var(--ink)}\n.btn.sm{padding:9px 16px;font-size:14px}\n\n/* ---------- placeholder imagery ---------- */\n.ph{\n  position:relative;border-radius:var(--radius);overflow:hidden;\n  background:\n    repeating-linear-gradient(135deg,var(--fill) 0 11px,var(--fill-2) 11px 22px);\n  border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;text-align:center;\n}\n.ph span{\n  font-family:var(--mono);font-size:12.5px;color:var(--ink-3);\n  background:var(--paper);padding:6px 12px;border-radius:6px;border:1px solid var(--line);\n  max-width:80%;line-height:1.4;\n}\n.ph.portrait{aspect-ratio:3/4}\n.ph.square{aspect-ratio:1/1}\n.ph.wide{aspect-ratio:16/9}\n.ph.tall{aspect-ratio:4/5}\n\n/* ---------- generic blocks ---------- */\n.grid{display:grid;gap:24px}\n.g2{grid-template-columns:repeat(2,1fr)}\n.g3{grid-template-columns:repeat(3,1fr)}\n.g4{grid-template-columns:repeat(4,1fr)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:26px}\n.bar{height:10px;border-radius:6px;background:var(--fill);margin:7px 0}\n.bar.w80{width:80%}.bar.w60{width:60%}.bar.w40{width:40%}.bar.w90{width:90%}\n.divider{height:1px;background:var(--line);border:0;margin:0}\n.tag{display:inline-block;font-family:var(--mono);font-size:12px;color:var(--ink-3);\n  border:1px solid var(--line);border-radius:20px;padding:4px 12px}\n.num{font-family:var(--mono);font-size:13px;color:var(--ink-3)}\n.bg-2{background:var(--paper-2)}\n.bg-ink{background:var(--ink);color:var(--paper)}\n.bg-ink p{color:#b9b6b2}.bg-ink .eyebrow{color:#8d8a86}\n\n/* ---------- comparison table (AI-company value props) ---------- */\n.cmp{display:grid;grid-template-columns:0.85fr 1.15fr 1.15fr;margin-top:30px;\n  border-top:1px solid var(--line);border-left:1px solid var(--line)}\n.cmp>div{padding:16px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}\n.cmp .corner{background:var(--paper-2)}\n.cmp .span{grid-column:2 / span 2;font-family:var(--mono);font-size:11.5px;letter-spacing:.06em;\n  text-transform:uppercase;color:var(--ink-3);background:var(--paper-2);text-align:center}\n.cmp .rowlabel{font-weight:700;color:var(--ink);background:var(--paper-2);display:flex;align-items:center;font-size:15px}\n.cmp .h{font-weight:700;font-size:15px;letter-spacing:-.01em}\n/* the highlighted Moody Pines column */\n.cmp .mp{background:var(--card);color:var(--ink);font-weight:500;\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink)}\n.cmp .mp.h{background:var(--ink);color:var(--paper);\n  box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 2px 0 var(--ink)}\n.cmp .mp.last{box-shadow:inset 2px 0 0 var(--ink),inset -2px 0 0 var(--ink),inset 0 -2px 0 var(--ink)}\n/* the muted traditional column */\n.cmp .trad{color:var(--ink-3)}\n.cmp .trad.h{color:var(--ink-2);background:var(--paper-2)}\n\n/* ---------- designer annotations (the only color) ---------- */\n.note{\n  position:relative;font-family:var(--mono);font-size:12.5px;line-height:1.45;\n  color:var(--accent);border:1px dashed var(--accent);background:var(--accent-soft);\n  border-radius:8px;padding:10px 14px 10px 30px;margin:0 0 22px;max-width:70ch;\n}\n.note::before{content:\"✱\";position:absolute;left:12px;top:9px;font-size:13px}\n.note b{font-weight:600}\n.no-notes .note{display:none}\n\n/* direction banner (top of each homepage variant) */\n.concept{\n  font-family:var(--mono);background:var(--accent);color:#fff;\n  padding:8px 40px;font-size:12.5px;letter-spacing:.03em;display:flex;gap:10px;align-items:center;\n}\n.concept b{font-weight:600}\n.no-notes .concept{display:none}\n\n/* ---------- footer ---------- */\n.footer{background:var(--ink);color:#b9b6b2;padding:56px 0 36px;margin-top:40px}\n.footer .page{display:grid;grid-template-columns:1.6fr 1fr 1fr 1fr;gap:32px}\n.footer h4{color:var(--paper);font-size:13px;font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em;margin:0 0 14px;font-weight:500}\n.footer a{display:block;color:#b9b6b2;font-size:14px;margin-bottom:9px}\n.footer a:hover{color:var(--paper)}\n.footer .brand{color:var(--paper)}\n.footer .brand .mark{border-bottom-color:var(--paper)}\n.footer .fine{grid-column:1/-1;border-top:1px solid #3a3836;margin-top:28px;padding-top:20px;font-size:12.5px;color:#7c7975;display:flex;justify-content:space-between}\n\n/* ---------- responsive-ish ---------- */\n@media(max-width:880px){\n  h1{font-size:42px}h2{font-size:30px}\n  .g2,.g3,.g4{grid-template-columns:1fr}\n  .nav .links{display:none}\n  .footer .page{grid-template-columns:1fr 1fr}\n  .cmp{grid-template-columns:1fr 1fr;font-size:13px}\n  .cmp>div{padding:12px 12px}\n  .cmp .rowlabel{grid-column:1 / -1;background:var(--paper-2)}\n  .cmp .corner{display:none}\n  .cmp .span{grid-column:1 / -1}\n}\n</style>\n</head>\n<body>\n\n<div class=\"chrome\">\n  <div class=\"dots\"><i></i><i></i><i></i></div>\n  <div class=\"url\">moodypines.com</div>\n</div>\n\n<div class=\"concept\"><b>DIRECTION D · \"Combined\"</b> — Working merge. Hero = Marketplace (C) split layout + two-door entry, with Manifesto (B) text direction. We build the rest of the page section by section from here.</div>\n\n<!-- NAV -->\n<nav class=\"nav\">\n  <div class=\"brand\"><span class=\"mark\"></span> Moody Pines</div>\n  <div class=\"links\"><a>For Talent</a><a>For AI Companies</a><a>How it works</a><a>About</a></div>\n  <div class=\"nav-cta\"><a class=\"btn sm\">Join early access</a></div>\n</nav>\n\n<!-- HERO: C layout (split + two doors) · B text direction -->\n<header class=\"page\" style=\"padding-top:64px;padding-bottom:32px\">\n  <div class=\"grid g2\" style=\"gap:48px;align-items:center\">\n    <div>\n      <p class=\"eyebrow\">Lorem ipsum dolor</p>\n      <h1 style=\"font-size:58px;max-width:15ch\">Your voice is yours. Even now.</h1>\n      <p class=\"lead\" style=\"max-width:52ch\">AI learned to speak from human voices. The people who gave it speech deserve to be paid, credited, and in control. We're building the infrastructure to make that the standard — not the exception.</p>\n      <!-- two-door entry (from C) -->\n      <div class=\"grid g2\" style=\"gap:16px;margin-top:26px\">\n        <a class=\"card\" style=\"display:block;padding:22px\">\n          <span class=\"tag\">I'm voice talent</span>\n          <h3 style=\"margin:14px 0 6px\">License my voice →</h3>\n          <p class=\"small\" style=\"margin:0\">Get paid, stay in control.</p>\n        </a>\n        <a class=\"card\" style=\"display:block;padding:22px\">\n          <span class=\"tag\">I'm an AI company</span>\n          <h3 style=\"margin:14px 0 6px\">Acquire voice data →</h3>\n          <p class=\"small\" style=\"margin:0\">Premium, licensed, defensible.</p>\n        </a>\n      </div>\n      <div class=\"note\" style=\"margin-top:22px\"><b>Hero merge:</b> C's split layout + two-door entry, with B's manifesto headline &amp; subhead. The stance reads first; the marketplace mechanic sits right under it. Copy is provisional — we'll tighten once the page structure is locked.</div>\n    </div>\n    <div class=\"ph portrait\" style=\"height:560px;aspect-ratio:auto\"><span>DOCUMENTARY PORTRAIT · talent in booth, headphones, mid-session · warm + real (not a polished headshot)</span></div>\n  </div>\n</header>\n\n<!-- HOW IT WORKS (from Home A) -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px\">\n    <div>\n      <p class=\"eyebrow\">How it works</p>\n      <h2 style=\"margin:0\">The trusted layer between talent and AI.</h2>\n    </div>\n    <a class=\"btn btn-ghost sm\">See the full process →</a>\n  </div>\n  <p style=\"margin:16px 0 42px\">Think Getty Images, for voice. Talent become licensors. AI companies become licensees. Moody Pines is the intermediary that makes it safe for both.</p>\n  <div class=\"grid g3\">\n    <div>\n      <div class=\"num\">STEP 01</div>\n      <div class=\"ph wide\" style=\"margin:12px 0 16px\"><span>diagram · talent onboards</span></div>\n      <h3>Talent license their voice</h3>\n      <p class=\"small\">Professional voices join on clear, structured terms. They keep control and know exactly how their voice can be used.</p>\n    </div>\n    <div>\n      <div class=\"num\">STEP 02</div>\n      <div class=\"ph wide\" style=\"margin:12px 0 16px\"><span>diagram · rights + quality layer</span></div>\n      <h3>Moody Pines structures rights &amp; quality</h3>\n      <p class=\"small\">Standardized contracts, premium recording, provenance and consent tracked end to end.</p>\n    </div>\n    <div>\n      <div class=\"num\">STEP 03</div>\n      <div class=\"ph wide\" style=\"margin:12px 0 16px\"><span>diagram · AI company licenses</span></div>\n      <h3>AI companies license with confidence</h3>\n      <p class=\"small\">Buyers get premium voice data with clear rights and legal protection — ready to deploy.</p>\n    </div>\n  </div>\n  </div>\n</section>\n\n<!-- THE ROSTER (from Home A) -->\n<section>\n  <div class=\"page\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px\">\n      <div>\n        <p class=\"eyebrow\">The roster</p>\n        <h2 style=\"margin:0\">Real voices. Real people. Real terms.</h2>\n      </div>\n      <a class=\"btn btn-ghost sm\">Meet the talent →</a>\n    </div>\n    <div class=\"grid g3\" style=\"margin-top:28px\">\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div class=\"ph portrait\" style=\"border-radius:0;border-left:0;border-right:0;border-top:0\"><span>PORTRAIT · narrator</span></div>\n        <div style=\"padding:22px\"><h3>Narrator · Documentary</h3><p class=\"small\" style=\"margin:0\">\"I finally know exactly what my voice is allowed to do — and what it isn't.\"</p></div>\n      </div>\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div class=\"ph portrait\" style=\"border-radius:0;border-left:0;border-right:0;border-top:0\"><span>PORTRAIT · broadcaster</span></div>\n        <div style=\"padding:22px\"><h3>Broadcaster · News</h3><p class=\"small\" style=\"margin:0\">\"A licensing model that treats my voice like the asset it is.\"</p></div>\n      </div>\n      <div class=\"card\" style=\"padding:0;overflow:hidden\">\n        <div class=\"ph portrait\" style=\"border-radius:0;border-left:0;border-right:0;border-top:0\"><span>PORTRAIT · character VO</span></div>\n        <div style=\"padding:22px\"><h3>Character &amp; Games</h3><p class=\"small\" style=\"margin:0\">\"Paid fairly, credited properly, and always in control.\"</p></div>\n      </div>\n    </div>\n  </div>\n</section>\n\n<!-- TRUST & PROVENANCE (from Home A) -->\n<section class=\"bg-ink\">\n  <div class=\"page\">\n    <p class=\"eyebrow\">Trust &amp; provenance</p>\n    <h2 style=\"color:var(--paper)\">Defensible by design.</h2>\n    <p style=\"max-width:60ch\">As AI grows more powerful, paperwork becomes the product. Consent, provenance, and rights management are built into every license — not bolted on after.</p>\n    <div class=\"grid g4\" style=\"margin-top:34px\">\n      <div><div class=\"num\" style=\"color:#8d8a86\">01</div><h3 style=\"color:var(--paper)\">Consent</h3><p class=\"small\" style=\"color:#b9b6b2\">Explicit, recorded, revocable.</p></div>\n      <div><div class=\"num\" style=\"color:#8d8a86\">02</div><h3 style=\"color:var(--paper)\">Provenance</h3><p class=\"small\" style=\"color:#b9b6b2\">Every dataset traceable to its source.</p></div>\n      <div><div class=\"num\" style=\"color:#8d8a86\">03</div><h3 style=\"color:var(--paper)\">Rights</h3><p class=\"small\" style=\"color:#b9b6b2\">Standardized, scalable contracts.</p></div>\n      <div><div class=\"num\" style=\"color:#8d8a86\">04</div><h3 style=\"color:var(--paper)\">Quality</h3><p class=\"small\" style=\"color:#b9b6b2\">Studio-grade recordings, vetted talent.</p></div>\n    </div>\n  </div>\n</section>\n\n<!-- WHY MOODY PINES (AI-company comparison) -->\n<section class=\"page\">\n  <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px\">\n    <div>\n      <p class=\"eyebrow\">For AI companies</p>\n      <h2 style=\"margin:0;max-width:20ch\">Why Moody Pines is superior to existing voice sources.</h2>\n    </div>\n    <a class=\"btn btn-ghost sm\">For AI companies →</a>\n  </div>\n  <p style=\"max-width:64ch;margin-top:16px\">Most AI teams still source voice by scraping, cloning, or stitching together one-off deals. Here's how a licensed Moody Pines dataset compares — on the things that decide whether your product is convincing, ships on time, and holds up under scrutiny.</p>\n\n  <div class=\"cmp\">\n    <!-- header band -->\n    <div class=\"corner\"></div>\n    <div class=\"span\">Sourcing voice for AI</div>\n    <!-- column headers -->\n    <div class=\"corner\"></div>\n    <div class=\"mp h\">The Moody Pines way</div>\n    <div class=\"trad h\">The traditional way</div>\n\n    <!-- Quality -->\n    <div class=\"rowlabel\">Quality</div>\n    <div class=\"mp\">Studio-grade recordings from vetted professionals — the bar others train toward.</div>\n    <div class=\"trad\">Variable — scraped, generic, or synthetic audio of uneven fidelity.</div>\n\n    <!-- Breadth -->\n    <div class=\"rowlabel\">Breadth</div>\n    <div class=\"mp\">Deep range across languages, dialects, emotional registers, and linguistic effects — the variety a convincing voice model actually needs.</div>\n    <div class=\"trad\">A narrow set of voices and languages — thin on accent, emotion, and delivery. Models trained on it can land flat or uncanny.</div>\n\n    <!-- Legal exposure -->\n    <div class=\"rowlabel\">Legal exposure</div>\n    <div class=\"mp\">Licensed directly from the artist, with documented consent to their biometric likeness. Defensible under due diligence.</div>\n    <div class=\"trad\">Scraped audio or third-party vendors — no clear chain to the person. If the rights don't hold, the liability is yours.</div>\n\n    <!-- Time -->\n    <div class=\"rowlabel\">Time to usable data</div>\n    <div class=\"mp\">A finished, rights-cleared dataset, off the shelf.</div>\n    <div class=\"trad\">6–12 months building relationships, negotiating one-offs, and recording from scratch.</div>\n\n    <!-- Relationship -->\n    <div class=\"rowlabel\">The relationship</div>\n    <div class=\"mp last\">We hold the artist relationship and the legal framework, so you don't have to build it.</div>\n    <div class=\"trad\">Teams avoid direct artist relationships by design, leaving the rights ambiguous.</div>\n  </div>\n\n  <div class=\"note\" style=\"margin-top:24px\"><b>Section note:</b> AI-company-facing, placed after Trust so the human story lands first. Moody Pines column is anchored left + outlined to read as the hero; the \"traditional\" column is deliberately muted. Status quo is described as <i>methods</i>, never named competitors. Order escalates: product quality (quality + breadth) → operational risk (legal + time + relationship).</div>\n</section>\n\n<!-- LATEST NEWS (3x2 grid · CMS-driven later) -->\n<section class=\"bg-2\">\n  <div class=\"page\">\n    <div style=\"display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px\">\n      <div>\n        <p class=\"eyebrow\">From the studio</p>\n        <h2 style=\"margin:0\">Latest from Moody Pines.</h2>\n      </div>\n      <a class=\"btn btn-ghost sm\" href=\"#\">See all articles →</a>\n    </div>\n\n    <div class=\"grid g3\" style=\"margin-top:30px\">\n      <a class=\"card\" style=\"padding:0;overflow:hidden;display:block\">\n        <div class=\"ph wide\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>article image</span></div>\n        <div style=\"padding:22px\">\n          <div style=\"display:flex;gap:10px;align-items:center;margin-bottom:10px\"><span class=\"tag\">Perspective</span><span class=\"num\">Jun 2026</span></div>\n          <h3 style=\"margin:0 0 8px\">Getty did it for photography. We're doing it for voice.</h3>\n          <p class=\"small\" style=\"margin:0\">The licensing playbook that legitimized an entire industry — and why voice is next.</p>\n        </div>\n      </a>\n      <a class=\"card\" style=\"padding:0;overflow:hidden;display:block\">\n        <div class=\"ph wide\" style=\"border-radius:0;border:0;border-bottom:1px solid var(--line)\"><span>article image</span></div>\n        <div style=\"padding:22px\">\n
